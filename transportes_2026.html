<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GELM APP</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#05010a;
    color:#fff;
}

.contenedor{
    padding:15px;
    max-width:600px;
    margin:auto;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#00ffc8;
    font-weight:bold;
}

.card{
    background:#0a0a0a;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
    box-shadow:0 0 10px rgba(0,255,255,.4);
}

.label{
    font-size:11px;
    color:#00ffc8;
}

.valor{
    font-size:14px;
    margin-bottom:8px;
}
</style>
</head>

<body>

<div class="contenedor">

<input id="busquedaInput" placeholder="Buscar placa, DPI, etc">
<button onclick="buscar()">Buscar</button>

<div id="resultado"></div>

</div>

<script>
const CSV_URL = "TU_LINK";

let registros=[];

function normalizar(t){
    return (t||"").replace(/[\s-]/g,"").toUpperCase();
}

async function cargarDatos(){
    const r=await fetch(CSV_URL);
    const t=await r.text();
    const filas=t.split("\n").map(f=>f.split(","));

    for(let i=1;i<filas.length;i++){
        const f=filas[i];
        if(!f[0]) continue;

        registros.push({
            placa:f[0],
            calcomania:f[1],
            ruta:f[5],
            piloto:f[7],
            dpi:f[8],
            licencia:f[10]
        });
    }
}

function construirCard(r){
return `
<div class="card">
<div class="label">PLACA</div>
<div class="valor">${r.placa}</div>

<div class="label">CALCOMANIA</div>
<div class="valor">${r.calcomania}</div>

<div class="label">RUTA</div>
<div class="valor">${r.ruta}</div>

<div class="label">PILOTO</div>
<div class="valor">${r.piloto}</div>

<div class="label">DPI</div>
<div class="valor">${r.dpi}</div>

<div class="label">LICENCIA</div>
<div class="valor">${r.licencia}</div>
</div>
`;
}

function buscar(){
    const txt=document.getElementById("busquedaInput").value;
    const limpio=normalizar(txt);

    const r=registros.find(x =>
        normalizar(x.placa)===limpio ||
        normalizar(x.dpi)===limpio
    );

    if(!r){
        document.getElementById("resultado").innerHTML="No encontrado";
        return;
    }

    document.getElementById("resultado").innerHTML=construirCard(r);
}

cargarDatos();
</script>

</body>
</html>
