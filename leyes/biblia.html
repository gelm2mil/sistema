<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia — GELM</title>

<style>
body{
  margin:0;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  color:#eee;
  background:
    radial-gradient(circle at 20% 0%, rgba(0,255,255,.2), transparent 50%),
    radial-gradient(circle at 80% 0%, rgba(255,0,255,.18), transparent 55%),
    #05010a;
}

.contenedor{
  max-width:1200px;
  margin:auto;
  background:rgba(0,0,0,.82);
  border-radius:18px;
  padding:20px;
  box-shadow:0 0 18px rgba(0,255,255,.5),0 0 50px #000;
  border:1px solid rgba(0,255,255,.35);
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo-box{
  padding:6px;
  border-radius:14px;
  background:radial-gradient(circle at 30% 0, rgba(0,255,120,.3), rgba(0,255,255,.05));
  box-shadow:0 0 10px rgba(0,255,120,.9),0 0 25px #000;
  border:1px solid rgba(0,255,180,.9);
}
.logo-box img{max-width:90px}

.titulo{
  text-align:center;
  flex:1;
}
.titulo h1{
  margin:0;
  font-size:22px;
  color:#00ffc8;
  text-shadow:0 0 10px #00ffff,0 0 25px #0044ff;
}
.titulo p{
  margin:6px 0 0;
  font-size:13px;
  color:#ffdf5e;
}

.buscador{
  margin:18px auto;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}
.buscador input{
  padding:10px 14px;
  border-radius:999px;
  border:1px solid #00ffc8;
  background:#050513;
  color:#00ffc8;
  min-width:260px;
}
.buscador button{
  padding:10px 22px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  background:radial-gradient(circle at 30% 0,#00ffff,#5f00ff);
  color:#000;
  font-weight:bold;
  box-shadow:0 0 12px rgba(0,255,255,.8);
}

.resultados{margin-top:10px}

.resultado{
  background:#b8ffe6;
  color:#001010;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #00ffc8;
}
.resultado h3{
  margin:0 0 6px 0;
  color:#003030;
  font-size:14px;
}

.similares{
  margin-top:8px;
}
.similares select{
  padding:6px 12px;
  border-radius:999px;
  border:1px solid #00ffc8;
  background:#020b40;
  color:#fff;
}

.footer{
  margin-top:18px;
  text-align:center;
  font-size:12px;
  color:#4ee8ff;
  text-shadow:0 0 8px #00fff2;
}
.footer strong{color:#7bffb2}
</style>
</head>

<body>
<div class="contenedor">

  <div class="header">
    <div class="logo-box">
      <img src="https://gelmhistoria.webcindario.com/pmt.jpg">
    </div>

    <div class="titulo">
      <h1>BIBLIA — PALABRA VIVA</h1>
      <p>“Lámpara es a mis pies tu palabra.” — Salmos 119:105</p>
    </div>

    <div class="logo-box">
      <img src="https://gelmhistoria.webcindario.com/PMT/gelm.png">
    </div>
  </div>

  <div class="buscador">
    <input id="q" placeholder="Ej: Génesis 1, Juan 3, amor, fe">
    <button onclick="buscar()">Buscar</button>
  </div>

  <div id="resultados" class="resultados"></div>

  <div class="footer">
    BY GELM — <strong>Palabra Viva</strong>
    <div id="fechaHora"></div>
  </div>

</div>

<script src="biblia_data.js"></script>

<script>
function esc(s){
  return s.toString()
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

let BIBLIA=[];
if(window.BIBLIA_DATA){
  window.BIBLIA_DATA.forEach(x=>{
    BIBLIA.push({
      libro:(x.libro||x.fuente||"").trim(),
      cap:(x.capitulo||"").toString().trim(),
      ver:(x.versiculo||"").toString().trim(),
      txt:(x.texto||"").trim()
    });
  });
}

function buscar(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const cont=document.getElementById("resultados");
  cont.innerHTML="";
  if(!q) return;

  if(/^\d+$/.test(q)){
    cont.innerHTML="<p>Escribe el libro y capítulo. Ej: Génesis 1, Juan 3.</p>";
    return;
  }

  let libro="",cap="";
  const p=q.split(/\s+/);
  if(p.length>=2 && !isNaN(p[p.length-1])){
    cap=p.pop();
    libro=p.join(" ");
  }

  let res=BIBLIA.filter(r=>{
    if(libro && cap){
      return r.libro.toLowerCase().includes(libro) && r.cap===cap;
    }
    return r.txt.toLowerCase().includes(q) ||
           r.libro.toLowerCase().includes(q);
  });

  if(!res.length){
    cont.innerHTML="<p>No se encontraron coincidencias.</p>";
    return;
  }

  const p0=res[0];
  cont.innerHTML=`
    <div class="resultado">
      <h3>${esc(p0.libro)} ${esc(p0.cap)}:${esc(p0.ver)}</h3>
      <div>${esc(p0.txt)}</div>
    </div>
  `;

  const sim=res.slice(1).filter(x=>x.libro===p0.libro && x.cap===p0.cap);
  if(sim.length){
    let html='<div class="similares"><select onchange="verSim(this.value)"><option value="">SIMILARES...</option>';
    sim.forEach((s,i)=>{
      html+=`<option value="${i}">${esc(s.libro)} ${esc(s.cap)}:${esc(s.ver)}</option>`;
    });
    html+='</select></div>';
    cont.insertAdjacentHTML("beforeend",html);
    window._sim=sim;
  }
}

function verSim(i){
  if(!_sim||!_sim[i])return;
  const s=_sim[i];
  document.getElementById("resultados").innerHTML=`
    <div class="resultado">
      <h3>${esc(s.libro)} ${esc(s.cap)}:${esc(s.ver)}</h3>
      <div>${esc(s.txt)}</div>
    </div>
  `;
}

function reloj(){
  const d=new Date();
  document.getElementById("fechaHora").textContent=
    d.toLocaleDateString("es-ES",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+
    " — "+d.toLocaleTimeString("es-ES");
}
setInterval(reloj,1000); reloj();
</script>
</body>
</html>
