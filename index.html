<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA OPERATIVO GELM</title>

<style>
:root{
  --neon:#00ffc8;
  --bg:#05010a;
  --panel:#020616;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui, Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 0%, rgba(0,255,255,.25), transparent 50%),
    radial-gradient(circle at 80% 0%, rgba(180,0,255,.25), transparent 55%),
    var(--bg);
  color:#e9f9ff;
  min-height:100vh;
}

/* ===== HEADER ===== */
header{
  padding:14px 10px;
  text-align:center;
  background:rgba(0,0,0,.55);
  border-bottom:1px solid rgba(0,255,200,.4);
  box-shadow:0 0 25px rgba(0,255,255,.35);
}

header h1{
  margin:0;
  font-size:1.2rem;
  color:var(--neon);
  text-shadow:0 0 12px var(--neon);
}

header small{
  display:block;
  margin-top:4px;
  font-size:.75rem;
  color:#9fffe8;
}

/* ===== LAYOUT ===== */
.main{
  display:flex;
  min-height:calc(100vh - 120px);
}

/* ===== SIDEBAR ===== */
nav{
  width:72px;
  padding:10px 6px;
  background:rgba(0,0,0,.65);
  border-right:1px solid rgba(0,255,200,.35);
  display:flex;
  flex-direction:column;
  gap:12px;
}

nav a{
  text-decoration:none;
  text-align:center;
  padding:12px 4px;
  border-radius:14px;
  color:var(--neon);
  font-size:.7rem;
  border:1px solid rgba(0,255,200,.45);
  background:linear-gradient(145deg,#020616,#05001a);
  box-shadow:
    0 0 12px rgba(0,255,255,.45),
    inset 0 0 10px rgba(0,255,255,.15);
  position:relative;
  overflow:hidden;
}

nav a::before{
  content:"";
  position:absolute;
  inset:-2px;
  background:linear-gradient(120deg,transparent,rgba(0,255,200,.8),transparent);
  transform:translateX(-120%);
  animation:scan 3s linear infinite;
}

@keyframes scan{
  0%{transform:translateX(-120%)}
  100%{transform:translateX(120%)}
}

nav a:hover{
  filter:brightness(1.15);
}

/* ===== CONTENT ===== */
section{
  flex:1;
  padding:18px;
}

.panel{
  max-width:920px;
  margin:0 auto;
  padding:22px;
  background:rgba(0,0,0,.7);
  border-radius:22px;
  border:1px solid rgba(0,255,200,.35);
  box-shadow:
    0 0 35px rgba(0,255,255,.4),
    inset 0 0 20px rgba(0,255,255,.1);
  text-align:center;
}

.panel h2{
  margin-top:0;
  color:var(--neon);
  text-shadow:0 0 14px var(--neon);
}

.panel p{
  font-size:.9rem;
  color:#cafff2;
}

/* ===== BOTÓN NOMBRE ===== */
.nombre{
  margin-top:16px;
}

.nombre button{
  background:transparent;
  border:1px solid var(--neon);
  color:var(--neon);
  padding:10px 22px;
  border-radius:999px;
  font-size:.8rem;
  cursor:pointer;
  box-shadow:0 0 16px rgba(0,255,255,.6);
}

.nombre button:hover{
  filter:brightness(1.2);
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:10px;
  font-size:.7rem;
  color:#7fffe8;
  border-top:1px solid rgba(0,255,200,.35);
  background:rgba(0,0,0,.6);
}

/* ===== MOBILE ===== */
@media(max-width:600px){
  header h1{font-size:1rem}
  nav{width:64px}
}
</style>
</head>

<body>

<header>
  <h1>SISTEMA OPERATIVO GELM</h1>
  <small>Creado por Genrin Lorenzo Ch.078 — BY GELM</small>
</header>

<div class="main">

  <nav>

    <a href="../2026/hechos.html">Hechos</a>
    <a href="../control/consignacion_pwa.html">Consigna</a>
    <a href="../control/index.html">Control</a>
    <a href="#">Leyes</a>
    <a href="#">Biblia</a>
  </nav>

  <section>
    <div class="panel">
      <h2>Centro de Operaciones</h2>
      <p>
        Sistema personal de trabajo, defensa y criterio.<br>
        Acceso central a módulos oficiales PMT.
      </p>

      <div class="nombre">
        <button>Genrin Lorenzo Ch.078</button>
      </div>
    </div>
  </section>

</div>

<footer>
  © 2026 — GELM | Sistema personal de trabajo y criterio
</footer>

</body>
</html>
