<style>
:root{
  --neon:#00ff66;
  --border:rgba(0,255,102,.8);
  --glow:0 0 25px rgba(0,255,102,1);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}

body{
  min-height:100vh;
  background:url("icons/natural.jpg") no-repeat center center;
  background-size:cover;
  color:#eafff2;
  overflow-x:hidden;
  transition:transform .2s ease-out;
}

/* ===== PARTICULAS ===== */
canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:2;
  margin:16px auto 14px;
  padding:16px 30px;
  border-radius:999px;
  background:rgba(255,255,255,.02);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  box-shadow:var(--glow);
  width:fit-content;
  text-align:center;
}
.header h1{
  font-size:18px;
  font-weight:900;
  color:var(--neon);
}
.header span{display:block;font-size:12px}
.header .hora{margin-top:4px;font-size:11px;color:#b8ffe2}

/* ===== PLAYER ===== */
.player{
  position:relative;
  z-index:2;
  max-width:420px;
  margin:10px auto 20px;
  padding:12px;
  border-radius:18px;
  background:rgba(255,255,255,.015);
  backdrop-filter:blur(25px);
  border:1px solid var(--border);
  box-shadow:var(--glow);
}
.player iframe{
  width:100%;
  height:120px;
  border:none;
  border-radius:14px;
}

/* ===== MENU ===== */
.menu{
  position:relative;
  z-index:2;
  max-width:640px;
  margin:0 auto 50px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  padding:0 16px;
}

.menu a{
  position:relative;
  overflow:hidden;
  text-decoration:none;
  text-align:center;
  padding:16px 12px;
  border-radius:20px;
  font-weight:800;
  font-size:13px;
  letter-spacing:.5px;
  color:var(--neon);
  background:transparent;
  backdrop-filter:blur(30px);
  border:1px solid var(--border);
  box-shadow:0 0 18px rgba(0,255,102,.7);
  transition:.25s ease;
}

/* pulsación permanente suave */
.menu a::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:20px;
  background:radial-gradient(circle at center,
   rgba(0,255,102,.35),
   transparent 70%);
  opacity:.15;
  animation:pulse 3s infinite;
}

@keyframes pulse{
  0%{opacity:.1}
  50%{opacity:.35}
  100%{opacity:.1}
}

.menu a:active{
  transform:scale(.96);
  box-shadow:0 0 40px rgba(0,255,102,1);
}

/* ===== FOOTER EXACTO ===== */
footer{
  position:relative;
  z-index:2;
  text-align:center;
  padding:18px 10px;
  font-size:13px;
  background:linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,.95));
  color:#00ffff;
  border-top:3px solid #00ffff;
  text-shadow:0 0 10px rgba(0,255,255,.8);
}
footer span{
  display:block;
  margin-top:6px;
  color:#00ffd5;
}

/* ===== BOTONES FLOTANTES ===== */
.btn-gpt,.btn-2026{
  position:fixed;
  bottom:18px;
  padding:14px 20px;
  border-radius:999px;
  background:transparent;
  backdrop-filter:blur(25px);
  color:var(--neon);
  font-weight:900;
  text-decoration:none;
  border:1px solid var(--border);
  box-shadow:var(--glow);
  z-index:3;
}
.btn-gpt{right:18px}
.btn-2026{left:18px}
</style>
</head>

<script>
/* FRASES */
const frases=[
"Gracias a Dios, un nuevo día.",
"El día avanza y tú lo estás logrando.",
"Disciplina hoy, tranquilidad mañana.",
"Orden, visión y firmeza.",
"Todo trabajo bien hecho deja huella."
];
function rotar(){
 document.getElementById("frase").textContent=
 frases[Math.floor(Math.random()*frases.length)];
}
rotar();setInterval(rotar,1000*60*30);

/* RELOJ */
function reloj(){
 const d=new Date();
 document.getElementById("hora").textContent=
 d.toLocaleDateString("es-GT",{weekday:"long",day:"numeric",month:"long"})+
 " — "+d.toLocaleTimeString("es-GT");

 document.getElementById("footerHora").textContent=
 d.toLocaleDateString("es-GT")+" | "+d.toLocaleTimeString("es-GT");
}
reloj();setInterval(reloj,1000);

/* PARTICULAS CHISPAS NARANJA NEON */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];
for(let i=0;i<80;i++){
 particles.push({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2+1,
  dx:(Math.random()-0.5)*0.4,
  dy:(Math.random()-0.5)*0.4
 });
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 particles.forEach(p=>{
  let gradient=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
  gradient.addColorStop(0,"rgba(255,140,0,1)");
  gradient.addColorStop(.4,"rgba(255,80,0,.8)");
  gradient.addColorStop(1,"rgba(255,0,0,0)");
  ctx.fillStyle=gradient;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r*2,0,Math.PI*2);
  ctx.fill();
  p.x+=p.dx;
  p.y+=p.dy;
 });
 requestAnimationFrame(draw);
}
draw();

/* MICRO PARALLAX MOVIL */
window.addEventListener("deviceorientation",e=>{
 if(!e.beta) return;
 let x=e.gamma/30;
 let y=e.beta/30;
 document.body.style.transform=
 `translate(${x}px,${y}px)`;
});
</script>
