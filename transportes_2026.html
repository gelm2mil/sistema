<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM BY GELM — TRANSPORTES 2026</title>

<style>
:root{
  --neon:#00ffd5;
  --bg1:#020b18;
  --bg2:#041d33;
  --card:rgba(4,18,34,.92);
  --txt:#e9ffff;
  --glow:0 0 18px rgba(0,255,213,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,Segoe UI,Arial;
  background:
    radial-gradient(circle at 20% 20%, #063b7a 0%, transparent 55%),
    radial-gradient(circle at 80% 80%, #0a0033 0%, transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--txt);
  min-height:100vh;
}
.wrapper{
  max-width:1200px;
  margin:20px auto;
  border:1px solid rgba(0,255,213,.35);
  border-radius:22px;
  background:rgba(0,0,0,.45);
  box-shadow:var(--glow);
}
.header{
  text-align:center;
  padding:18px;
  border-bottom:1px solid rgba(0,255,213,.25);
}
.header h1{color:var(--neon)}
.fecha{font-size:13px;opacity:.8}

.content{padding:22px}

input{
  width:100%;
  padding:14px;
  border-radius:14px;
  background:#000;
  border:1px solid rgba(0,255,213,.45);
  color:var(--neon);
  font-size:16px;
  outline:none;
  margin-bottom:12px;
}

.lista{
  max-height:300px;
  overflow-y:auto;
  background:#000;
  border:1px solid rgba(0,255,213,.35);
  border-radius:16px;
}
.item{
  padding:12px 14px;
  border-bottom:1px solid rgba(0,255,213,.15);
  cursor:pointer;
}
.item:hover{
  background:var(--neon);
  color:#000;
}

.preview{
  font-size:13px;
  opacity:.9;
}

.info{
  margin:16px 0;
  padding:14px;
  border-radius:16px;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(0,255,213,.35);
  color:var(--neon);
  text-align:center;
}

.tabla{
  overflow-x:auto;
  background:var(--card);
  border-radius:16px;
  border:1px solid rgba(0,255,213,.35);
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}
th,td{
  padding:8px;
  border:1px solid rgba(255,255,255,.15);
}
th{
  background:var(--neon);
  color:#000;
}

.footer{
  text-align:center;
  font-size:12px;
  padding:12px;
  opacity:.8;
}
</style>
</head>

<body>
<div class="wrapper">

<div class="header">
  <h1>SYSTEM BY GELM — TRANSPORTES 2026</h1>
  <div id="fecha" class="fecha"></div>
</div>

<div class="content">
  <input id="buscar" placeholder="Buscar por placa, calcomanía, nombre, ruta...">

  <div id="lista" class="lista"></div>

  <div id="info" class="info">Seleccione un registro</div>

  <div id="tabla" class="tabla"></div>
</div>

<div class="footer">
© 2025–2026 — Sistema GELM · Uso interno autorizado
</div>

</div>

<script>
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSwaUTpai-4dbcMc3imM8jfxPu7Wrzwpi-EqICd1yDRHmFfKAMwMxu8jwXMXqs3GQ/pub?gid=1355305835&single=true&output=csv";
let data=[];

function fecha(){
  const f=new Date();
  fechaEl.textContent=f.toLocaleDateString("es-GT",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+
  " — "+f.toLocaleTimeString("es-GT");
}
const fechaEl=document.getElementById("fecha");
setInterval(fecha,1000);fecha();

fetch(URL)
.then(r=>r.text())
.then(t=>{
  data=t.split("\n").map(l=>l.split(","));
  renderLista();
});

function renderLista(){
  lista.innerHTML="";
  data.slice(1).forEach(f=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`
      <strong>${f[1]}</strong> — ${f[2] || "SIN NOMBRE"}<br>
      <span class="preview">${f[4] || ""} · ${f[0] || ""}</span>
    `;
    d.onclick=()=>mostrar(f);
    lista.appendChild(d);
  });
}

function mostrar(f){
  info.innerHTML=`<strong>${f[1]}</strong> — ${f[4]}`;
  let h="<table><tr>";
  data[0].forEach(c=>h+=`<th>${c}</th>`);
  h+="</tr><tr>";
  f.forEach(c=>h+=`<td>${c}</td>`);
  h+="</tr></table>";
  tabla.innerHTML=h;
}

buscar.addEventListener("input",()=>{
  const q=buscar.value.toLowerCase();
  lista.innerHTML="";
  data.slice(1).filter(f=>f.join(" ").toLowerCase().includes(q))
  .forEach(f=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`
      <strong>${f[1]}</strong> — ${f[2] || "SIN NOMBRE"}<br>
      <span class="preview">${f[4] || ""} · ${f[0] || ""}</span>
    `;
    d.onclick=()=>mostrar(f);
    lista.appendChild(d);
  });
});
</script>
</body>
</html>
