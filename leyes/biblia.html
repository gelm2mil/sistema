<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia — GELM</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    color:#eee;
    background:
        radial-gradient(circle at 20% 0%, rgba(0,255,255,.2), transparent 50%),
        radial-gradient(circle at 80% 0%, rgba(255,0,255,.18), transparent 55%),
        #05010a;
    background-attachment:fixed;
}
.contenedor{
    max-width:1200px;
    margin:0 auto;
    background:rgba(0,0,0,.82);
    border-radius:18px;
    padding:20px;
    box-shadow:0 0 18px rgba(0,255,255,.5),0 0 50px rgba(0,0,0,1);
    border:1px solid rgba(0,255,255,.35);
}
.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}
.logo-box{
    padding:6px;
    border-radius:14px;
    box-shadow:0 0 10px rgba(0,255,120,.9);
    border:1px solid rgba(0,255,180,.9);
}
.logo-box img{max-width:110px}
.titulo{
    flex:1;
    text-align:center;
}
.titulo h1{
    margin:0;
    color:#00ffc8;
    text-shadow:0 0 10px #00ffff;
}
.titulo h2{
    margin:6px 0 0 0;
    color:#ffdf5e;
    font-size:14px;
}
.verso-random{
    margin:15px 0;
    padding:10px 14px;
    border-radius:999px;
    border:1px solid rgba(0,255,255,.4);
    text-align:center;
    color:#a8ffe8;
}
.buscador{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:10px;
}
.buscador input{
    padding:10px 14px;
    border-radius:999px;
    border:1px solid #00ffc8;
    background:#050513;
    color:#00ffc8;
    min-width:260px;
}
.buscador button{
    padding:10px 22px;
    border-radius:999px;
    border:none;
    background:radial-gradient(circle at 30% 0,#00ffff,#5f00ff);
    font-weight:bold;
    cursor:pointer;
}
#resultado-principal{
    margin-top:10px;
    background:#c7ffe9;
    color:#000;
    padding:14px;
    border-radius:14px;
}
.similares-box{
    margin-top:10px;
    color:#a8ffe8;
    font-size:12px;
}
.similares-box select{
    background:#020b40;
    color:#fff;
    border-radius:999px;
    border:1px solid #00ffc8;
    padding:6px 10px;
    min-width:260px;
}
.footer{
    margin-top:16px;
    text-align:center;
    font-size:12px;
    color:#4ee8ff;
}
</style>
</head>

<body>
<div class="contenedor">
    <div class="header-top">
        <div class="logo-box">
            <img src="https://gelmhistoria.webcindario.com/pmt.jpg">
        </div>

        <div class="titulo">
            <h1>BIBLIA — PALABRA DE VIDA</h1>
            <h2>“Lámpara es a mis pies tu palabra.” — Salmos 119:105</h2>
        </div>

        <div class="logo-box">
            <img src="https://gelmhistoria.webcindario.com/PMT/gelm.png">
        </div>
    </div>

    <div id="versoRandom" class="verso-random"></div>

    <div class="buscador">
        <input id="q" placeholder="Ej: Génesis 1, Juan 3, amor, Jesús">
        <button onclick="buscar()">Buscar</button>
    </div>

    <div id="resultado-principal"></div>
    <div id="similares-contenedor"></div>

    <div class="footer">
        BY GELM — Uso personal | Palabra Viva<br>
        <span id="fechaHora"></span>
    </div>
</div>

<script src="biblia_data.js"></script>
<script>
function norm(t){
    return t.toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"");
}

let resultados = [];

function versoAleatorio(){
    if(!window.BIBLIA_DATA || !BIBLIA_DATA.length) return;
    const txt = BIBLIA_DATA[0].texto;
    const partes = txt.split(".");
    const v = partes[Math.floor(Math.random()*partes.length)];
    document.getElementById("versoRandom").textContent = v.trim();
}

function buscar(){
    const q = document.getElementById("q").value.trim();
    const out = document.getElementById("resultado-principal");
    const sim = document.getElementById("similares-contenedor");
    sim.innerHTML="";
    out.innerHTML="";

    if(!q){
        out.textContent="Escribe una búsqueda.";
        return;
    }

    const nQ = norm(q);
    resultados = [];

    BIBLIA_DATA.forEach(b=>{
        const texto = b.texto;
        const nTexto = norm(texto);

        let idx = nTexto.indexOf(nQ);
        while(idx !== -1){
            const start = Math.max(0, idx-120);
            const end   = Math.min(texto.length, idx+200);
            const frag  = texto.substring(start,end);
            resultados.push(frag.trim());
            idx = nTexto.indexOf(nQ, idx+1);
        }
    });

    if(resultados.length===0){
        out.textContent="No se encontraron coincidencias.";
        return;
    }

    out.textContent = resultados[0];

    if(resultados.length>1){
        let html = '<div class="similares-box"><label>SIMILARES:</label> ';
        html += '<select onchange="mostrar(this.value)">';
        html += '<option value="">-- seleccionar --</option>';
        resultados.slice(1).forEach((r,i)=>{
            html += `<option value="${i+1}">Resultado ${i+2}</option>`;
        });
        html += '</select></div>';
        sim.innerHTML = html;
    }
}

function mostrar(i){
    if(!i) return;
    document.getElementById("resultado-principal").textContent = resultados[i];
}

function reloj(){
    const d = new Date();
    document.getElementById("fechaHora").textContent =
        d.toLocaleDateString("es-ES",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+
        " — " + d.toLocaleTimeString("es-ES");
}
setInterval(reloj,1000);
reloj();
versoAleatorio();
</script>
</body>
</html>
