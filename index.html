<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GELM - SYSTEM</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff66">

<style>
:root{
  --neon:#00ff66;
  --border:rgba(0,255,102,.9);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}

body{
  min-height:100vh;
  background:url("icons/natural.jpg") no-repeat center center;
  background-size:cover;
  color:#eafff2;
  overflow-x:hidden;
}

/* PARTICULAS */
canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* AURORA REACTIVA */
.aurora{
  position:fixed;
  top:-20%;
  left:-20%;
  width:140%;
  height:60%;
  background:radial-gradient(ellipse at center,
    rgba(0,255,102,.3),
    rgba(0,255,102,.15),
    transparent 70%);
  filter:blur(100px);
  z-index:1;
  pointer-events:none;
  transition:opacity .2s linear;
}

/* HEADER */
.header{
  position:relative;
  z-index:3;
  margin:20px auto;
  padding:18px 36px;
  border-radius:999px;
  background:rgba(255,255,255,.03);
  backdrop-filter:blur(25px);
  border:1px solid var(--border);
  box-shadow:0 0 30px rgba(0,255,102,.6);
  width:fit-content;
  text-align:center;
}
.header h1{color:var(--neon);font-weight:900;font-size:18px}
.header span{display:block;font-size:12px}
.header .hora{margin-top:4px;font-size:11px;color:#b8ffe2}

/* PLAYER */
.player{
  position:relative;
  z-index:3;
  max-width:420px;
  margin:0 auto 30px;
  padding:14px;
  border-radius:20px;
  background:rgba(255,255,255,.02);
  backdrop-filter:blur(28px);
  border:1px solid var(--border);
  box-shadow:0 0 25px rgba(0,255,102,.7);
}
.player iframe{
  width:100%;
  height:120px;
  border:none;
  border-radius:14px;
}

/* MENU */
.menu{
  position:relative;
  z-index:3;
  max-width:650px;
  margin:0 auto 70px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  padding:0 16px;
}

.menu a{
  position:relative;
  overflow:hidden;
  text-decoration:none;
  text-align:center;
  padding:18px 12px;
  border-radius:22px;
  font-weight:800;
  font-size:13px;
  letter-spacing:.5px;
  color:var(--neon);
  background:transparent;
  backdrop-filter:blur(35px);
  border:1px solid var(--border);
  transition:.2s ease;
}

.menu a::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:22px;
  border:2px solid rgba(0,255,102,.8);
  opacity:.4;
  transition:opacity .1s linear;
}

.menu a:active{
  transform:scale(.95);
}

/* FOOTER */
footer{
  position:relative;
  z-index:3;
  text-align:center;
  padding:18px 10px;
  font-size:13px;
  background:linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,.95));
  color:#00ffff;
  border-top:3px solid #00ffff;
  text-shadow:0 0 10px rgba(0,255,255,.8);
}
footer span{display:block;margin-top:6px;color:#00ffd5}

/* BOTONES FLOTANTES */
.btn-gpt,.btn-2026{
  position:fixed;
  bottom:18px;
  padding:14px 22px;
  border-radius:999px;
  background:transparent;
  backdrop-filter:blur(28px);
  color:var(--neon);
  font-weight:900;
  text-decoration:none;
  border:1px solid var(--border);
  box-shadow:0 0 25px rgba(0,255,102,.8);
  z-index:4;
}
.btn-gpt{right:18px}
.btn-2026{left:18px}
</style>
</head>

<body>

<div class="aurora"></div>
<canvas id="particles"></canvas>

<div class="header">
  <h1>GELM - SYSTEM</h1>
  <span id="frase"></span>
  <div id="hora" class="hora"></div>
</div>

<div class="player">
  <iframe src="https://gelm2mil.github.io/play/" loading="lazy"></iframe>
</div>

<div class="menu">
  <!-- TU MENU ORIGINAL intacto -->
  ...
</div>

<footer>
2014 - 2025 | BY GELM | Delegación de Transportes PMT - Chimaltenango
<span>att: —[GELM]—</span>
<span id="footerHora"></span>
</footer>

<a href="transportes_2026.html" target="_blank" class="btn-2026">2026</a>
<a href="https://chat.openai.com/" target="_blank" class="btn-gpt">🤖 GPT</a>

<audio id="audio" autoplay loop></audio>

<script>
/* AUDIO REACTIVO */
const audio=document.getElementById("audio");
audio.src="AQUI_TU_AUDIO.mp3"; // PON TU MUSICA AQUI

const ctxAudio=new (window.AudioContext||window.webkitAudioContext)();
const src=ctxAudio.createMediaElementSource(audio);
const analyser=ctxAudio.createAnalyser();
src.connect(analyser);
analyser.connect(ctxAudio.destination);
analyser.fftSize=256;

const bufferLength=analyser.frequencyBinCount;
const dataArray=new Uint8Array(bufferLength);

/* PARTICULAS */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];
for(let i=0;i<80;i++){
 particles.push({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2+1,
  dx:(Math.random()-0.5)*0.5,
  dy:(Math.random()-0.5)*0.5
 });
}

function animate(){
 analyser.getByteFrequencyData(dataArray);
 let avg=dataArray.reduce((a,b)=>a+b)/bufferLength;
 let intensity=avg/255;

 ctx.clearRect(0,0,canvas.width,canvas.height);

 particles.forEach(p=>{
  let size=p.r*(1+intensity*2);
  let g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,size*4);
  g.addColorStop(0,"rgba(255,180,0,1)");
  g.addColorStop(.5,"rgba(255,80,0,.9)");
  g.addColorStop(1,"rgba(255,0,0,0)");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(p.x,p.y,size*2,0,Math.PI*2);
  ctx.fill();
  p.x+=p.dx;
  p.y+=p.dy;
 });

 document.querySelector(".aurora").style.opacity=0.4+intensity;

 document.querySelectorAll(".menu a::before");

 requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
