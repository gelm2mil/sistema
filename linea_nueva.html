<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM BY GELM — LÍNEA NUEVA 2026</title>

<style>
:root{
  --neon:#00ffd5;
  --glass:rgba(255,255,255,.05);
  --border:rgba(0,255,213,.6);
  --glow:0 0 20px rgba(0,255,213,.45);
  --txt:#e9ffff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui,Segoe UI,Arial;
  background:url("icons/natural.jpg") no-repeat center center;
  background-size:cover;
  background-attachment:scroll;
  color:var(--txt);
  min-height:100vh;
}

/* CONTENEDOR */
.wrapper{
  max-width:1100px;
  margin:20px auto;
  background:var(--glass);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--glow);
  overflow:hidden;
}

/* HEADER */
.header{
  text-align:center;
  padding:18px;
  border-bottom:1px solid rgba(0,255,213,.3);
}
.header h1{
  color:var(--neon);
  text-shadow:0 0 12px rgba(0,255,213,.7);
}
.fecha-hora{
  font-size:13px;
  opacity:.9;
  margin-top:4px;
}

/* CONTENIDO */
.content{padding:24px}

/* BUSCADOR */
.buscador{
  max-width:520px;
  margin:0 auto 12px;
}
.buscador input{
  width:100%;
  padding:14px 16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  color:var(--neon);
  font-size:16px;
  outline:none;
  box-shadow:var(--glow);
}

/* SIMILARES */
.similares{
  max-width:520px;
  margin:0 auto 16px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:18px;
  display:none;
  max-height:260px;
  overflow-y:auto;
}
.similares .item{
  padding:12px 14px;
  border-bottom:1px solid rgba(0,255,213,.2);
  cursor:pointer;
}
.similares .item:hover{
  background:rgba(0,255,213,.25);
  color:#000;
}

/* LISTA */
.lista{
  max-width:520px;
  margin:0 auto 18px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:18px;
  max-height:220px;
  overflow-y:auto;
}
.lista div{
  padding:10px 14px;
  border-bottom:1px solid rgba(0,255,213,.2);
  cursor:pointer;
}
.lista div:hover{
  background:rgba(0,255,213,.25);
  color:#000;
}

/* INFO */
.info-activa{
  max-width:720px;
  margin:0 auto 18px;
  padding:16px;
  border-radius:18px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  box-shadow:var(--glow);
  text-align:center;
  color:var(--neon);
}

/* RESULTADO */
.resultado{
  max-width:900px;
  margin:0 auto;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--glow);
  padding:16px;
  display:none;
  overflow-x:auto;
}
table{
  width:100%;
  min-width:720px;
  border-collapse:collapse;
}
th,td{
  border:1px solid rgba(255,255,255,.25);
  padding:8px;
}
th{
  background:rgba(0,255,213,.75);
  color:#000;
}

/* FOOTER */
.footer{
  text-align:center;
  font-size:12px;
  padding:14px;
  border-top:1px solid rgba(0,255,213,.3);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  opacity:.9;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="header">
    <h1>SYSTEM BY GELM — LÍNEA NUEVA 2026</h1>
    <div id="fechaHora" class="fecha-hora"></div>
  </div>

  <div class="content">
    <div class="buscador">
      <input id="buscar" placeholder="Buscar placa..." autocomplete="off">
    </div>

    <div id="similares" class="similares"></div>
    <div id="lista" class="lista"></div>

    <div id="infoActiva" class="info-activa">Seleccione una placa</div>
    <div id="resultado" class="resultado"></div>
  </div>

  <div class="footer">
    © 2025–2026 — Sistema GELM<br>
    Desarrollo, diseño y propiedad intelectual reservada — BY GELM<br>
    Uso interno autorizado
  </div>
</div>

<script>
function actualizarHora(){
  const f=new Date();
  fechaHora.textContent =
    f.toLocaleDateString("es-GT",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+
    " — "+f.toLocaleTimeString("es-GT");
}
setInterval(actualizarHora,1000);actualizarHora();

const URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFZRw9HobwZM4W74A6LHkKrdkh9sNG87pD53I0RkCbi7TvI06q12IFdZYWeVo4lBR_pogKN9CuOJeg/pub?gid=180066267&single=true&output=csv";

let filas=[];
const buscar=document.getElementById("buscar");
const similares=document.getElementById("similares");

const norm=t=>t.toUpperCase().replace(/[^A-Z0-9]/g,"");

fetch(URL).then(r=>r.text()).then(t=>{
  filas=t.split("\n").map(l=>l.split(","));
  const lista=document.getElementById("lista");
  filas.forEach((f,i)=>{
    if(i===0) return;
    const d=document.createElement("div");
    d.textContent=f[1];
    d.onclick=()=>mostrar(f);
    lista.appendChild(d);
  });
});

buscar.addEventListener("input",()=>{
  const q=norm(buscar.value);
  similares.innerHTML="";
  if(q.length<2){similares.style.display="none";return;}
  filas.forEach((f,i)=>{
    if(i===0) return;
    if(norm(f.join(" ")).includes(q)){
      const d=document.createElement("div");
      d.className="item";
      d.innerHTML=`<strong>${f[1]}</strong><br>${f[3]} — ${f[2]}<br>${f[4]}`;
      d.onclick=()=>mostrar(f);
      similares.appendChild(d);
    }
  });
  similares.style.display="block";
});

function mostrar(f){
  similares.style.display="none";
  infoActiva.innerHTML=`<strong>${f[1]}</strong> — ${f[3]}<br>${f[2]} | ${f[4]}`;
  let h="<table><tr>"+f.map(()=>"<th>Dato</th>").join("")+"</tr><tr>";
  h+=f.map(c=>`<td>${c}</td>`).join("")+"</tr></table>";
  resultado.innerHTML=h;
  resultado.style.display="block";
}
</script>

</body>
</html>
