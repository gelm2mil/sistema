<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leyes - GELM</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle at top,#020b12,#2b0033);
  color:#eaffff;
}

.header{
  text-align:center;
  padding:16px;
  background:rgba(0,0,0,.6);
  border-bottom:1px solid rgba(0,255,200,.3);
}

.header h1{
  margin:0;
  font-size:18px;
  color:#00ffc8;
}

.header span{
  font-size:12px;
  color:#9fffe6;
}

.buscador{
  display:flex;
  gap:10px;
  padding:12px 16px;
  justify-content:center;
  flex-wrap:wrap;
  border-bottom:1px solid rgba(0,255,200,.15);
}

.buscador input{
  flex:1;
  max-width:420px;
  padding:12px;
  border-radius:999px;
  border:1px solid #00ffc8;
  background:#020616;
  color:#00ffc8;
  font-size:15px;
}

.buscador button{
  padding:12px 22px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  background:linear-gradient(135deg,#00ffff,#5f00ff);
  color:#000;
  font-weight:bold;
  box-shadow:0 0 12px rgba(0,255,255,.8);
}

.resultados{
  padding:16px;
}

.resultado{
  background:rgba(0,0,0,.6);
  border:1px solid rgba(0,255,200,.3);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.resultado h3{
  margin:0 0 6px 0;
  color:#7bffb2;
  font-size:14px;
}

.resultado small{
  color:#9fffe6;
  font-size:12px;
}

.marcado{
  background:yellow;
  color:#000;
  padding:2px 4px;
  border-radius:4px;
}
</style>
</head>

<body>

<div class="header">
  <h1>MÓDULO DE LEYES</h1>
  <span>Buscador legal offline — BY GELM</span>
</div>

<div class="buscador">
  <input id="q_penal" placeholder="Código Penal">
  <button onclick="buscarEn('penal')">Buscar</button>
</div>

<div class="buscador">
  <input id="q_reg273" placeholder="Reglamento 273">
  <button onclick="buscarEn('reg273')">Buscar</button>
</div>

<div class="buscador">
  <input id="q_const" placeholder="Constitución Política">
  <button onclick="buscarEn('const')">Buscar</button>
</div>

<div class="buscador">
  <input id="q_transito" placeholder="Ley y Reglamento de Tránsito">
  <button onclick="buscarEn('transito')">Buscar</button>
</div>

<div class="buscador">
  <input id="q_trabajo" placeholder="Código de Trabajo">
  <button onclick="buscarEn('trabajo')">Buscar</button>
</div>

<div class="buscador">
  <input id="q_biblia" placeholder="Biblia">
  <button onclick="buscarEn('biblia')">Buscar</button>
</div>

<div id="resultados" class="resultados"></div>

<!-- BASES LEGALES -->
<script src="constitucion_leyes_data.js"></script>
<script src="codigo_trabajo.js"></script>
<script src="codigo_municipal.js"></script>
<script src="codigo_penal.js"></script>
<script src="ley_transito_2025.js"></script>
<script src="reglamento_273.js"></script>
<script src="biblia_data.js"></script>
<!-- <script src="biblia_data.js"></script> -->

<!-- PUENTE ENTRE FORMATOS -->
<script>
window.LEYES = [];

if (window.LEYES_DATA) {
  window.LEYES_DATA.forEach(item => {
    LEYES.push({
      ley: item.fuente || "Constitución",
      articulo: item.articulo || "",
      texto: item.texto || ""
    });
  });
}
</script>

<!-- MOTOR POR MÓDULO -->
<script>
function buscarEn(tipo){
  const map = {
    penal:    { q: "q_penal",    filtro: "penal" },
    reg273:   { q: "q_reg273",   filtro: "273" },
    const:    { q: "q_const",    filtro: "constitución" },
    transito: { q: "q_transito", filtro: "tránsito" },
    trabajo:  { q: "q_trabajo",  filtro: "trabajo" },
    biblia:   { q: "q_biblia",   filtro: "biblia" }
  };

  const cfg = map[tipo];
  const texto = document.getElementById(cfg.q).value.trim().toLowerCase();
  const cont = document.getElementById("resultados");
  cont.innerHTML = "";

  if(!texto) return;

  const data = LEYES.filter(x =>
    (x.ley || "").toLowerCase().includes(cfg.filtro) &&
    (x.texto || "").toLowerCase().includes(texto)
  );

  if(!data.length){
    cont.innerHTML = "<p>No se encontraron coincidencias.</p>";
    return;
  }

  data.forEach(r=>{
    const div = document.createElement("div");
    div.className = "resultado";
    div.innerHTML = `
      <h3>${r.ley} — ${r.articulo}</h3>
      <small>${r.texto}</small>
    `;
    cont.appendChild(div);
  });
}
</script>

</body>
</html>
