<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GELM - SYSTEM</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff66">

<style>
:root{
  --neon:#00ff66;
  --glass:rgba(0,0,0,.35);
  --glass-strong:rgba(0,0,0,.45);
  --glow:0 0 18px rgba(0,255,102,.6);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}

body{
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),
    url("icons/natural.jpg") no-repeat center center fixed;
  background-size:cover;
  color:#eafff2;
  overflow-x:hidden;
}

/* ===== PARTICULAS ===== */
canvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:2;
  margin:18px auto 12px;
  padding:16px 28px;
  border-radius:999px;
  background:var(--glass);
  backdrop-filter:blur(12px);
  border:1px solid rgba(0,255,102,.4);
  box-shadow:var(--glow);
  width:fit-content;
  text-align:center;
}
.header h1{font-size:18px;font-weight:800;color:var(--neon)}
.header span{display:block;font-size:12px;font-weight:600}
.header .hora{margin-top:4px;font-size:11px;color:#bfffe0}

/* ===== PLAYER ===== */
.player{
  position:relative;
  z-index:2;
  max-width:420px;
  margin:10px auto 20px;
  padding:12px;
  border-radius:18px;
  background:var(--glass-strong);
  backdrop-filter:blur(14px);
  border:1px solid rgba(0,255,102,.4);
  box-shadow:var(--glow);
}
.player iframe{
  width:100%;
  height:120px;
  border:none;
  border-radius:14px;
}

/* ===== MENU ===== */
.menu{
  position:relative;
  z-index:2;
  max-width:640px;
  margin:0 auto 40px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  padding:0 16px;
}
.menu a{
  text-decoration:none;
  text-align:center;
  padding:16px 12px;
  border-radius:18px;
  font-weight:800;
  font-size:13px;
  letter-spacing:.5px;
  color:var(--neon);
  background:rgba(0,0,0,.30);
  backdrop-filter:blur(18px);
  border:1px solid rgba(0,255,102,.5);
  box-shadow:0 0 16px rgba(0,255,102,.45);
  transition:.3s ease;
}
.menu a:hover{
  transform:translateY(-3px);
  box-shadow:0 0 22px rgba(0,255,102,.9);
}

/* ===== FOOTER ===== */
footer{
  position:relative;
  z-index:2;
  text-align:center;
  font-size:11px;
  padding:14px;
  color:#9fffd1;
  border-top:1px solid rgba(0,255,102,.25);
  backdrop-filter:blur(6px);
}

/* ===== BOTONES FLOTANTES ===== */
.btn-gpt,.btn-2026{
  position:fixed;
  bottom:18px;
  padding:14px 20px;
  border-radius:999px;
  background:var(--glass);
  backdrop-filter:blur(12px);
  color:var(--neon);
  font-weight:900;
  text-decoration:none;
  border:1px solid rgba(0,255,102,.5);
  box-shadow:var(--glow);
  z-index:3;
}
.btn-gpt{right:18px}
.btn-2026{left:18px}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="header">
  <h1>GELM - SYSTEM</h1>
  <span id="frase"></span>
  <div id="hora" class="hora"></div>
</div>

<div class="player">
  <iframe src="https://gelm2mil.github.io/play/" loading="lazy"></iframe>
</div>

<div class="menu">
  <a href="#">AGENDA</a>
  <a href="#">RENOVACIÓN</a>
  <a href="#">REGISTRO 2026</a>
  <a href="#">D.PASO</a>
  <a href="#">C. PERMANENTE</a>
  <a href="#">C. TEMPORAL</a>
  <a href="#">LÍNEA NUEVA</a>
  <a href="#">TRASPASO</a>
  <a href="#">SUPLENTES</a>
  <a href="#">CONSIGNA</a>
  <a href="#">TRANSPORTES</a>
  <a href="#">REGLAMENTO 273</a>
  <a href="#">HECHOS</a>
  <a href="#">MULTAS SAT</a>
  <a href="#">MULTAS</a>
  <a href="#">BACK UP</a>
  <a href="#">CÓDIGO MUNICIPAL</a>
  <a href="#">BIBLIA</a>
</div>

<footer>
© 2025–2026 — Sistema GELM<br>
Uso interno autorizado
</footer>

<a href="#" class="btn-2026">2026</a>
<a href="#" class="btn-gpt">🤖 GPT</a>

<script>
/* ===== FRASES Y RELOJ ===== */
const frases=[
"Gracias a Dios, un nuevo día.",
"El día avanza y tú lo estás logrando.",
"Disciplina hoy, tranquilidad mañana.",
"Orden, visión y firmeza.",
"Todo trabajo bien hecho deja huella."
];
function rotar(){
 document.getElementById("frase").textContent=
 frases[Math.floor(Math.random()*frases.length)];
}
rotar();setInterval(rotar,1000*60*30);

function reloj(){
 const d=new Date();
 document.getElementById("hora").textContent=
 d.toLocaleDateString("es-GT",{weekday:"long",day:"numeric",month:"long"})+
 " — "+d.toLocaleTimeString("es-GT");
}
reloj();setInterval(reloj,1000);

/* ===== PARTICULAS SUAVES ===== */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<60;i++){
 particles.push({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2+1,
  dx:(Math.random()-0.5)*0.3,
  dy:(Math.random()-0.5)*0.3
 });
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="rgba(0,255,102,.6)";
 particles.forEach(p=>{
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fill();
  p.x+=p.dx;
  p.y+=p.dy;
  if(p.x<0||p.x>canvas.width)p.dx*=-1;
  if(p.y<0||p.y>canvas.height)p.dy*=-1;
 });
 requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
