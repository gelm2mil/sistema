<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM BY GELM — TRANSPORTES 2026</title>

<style>
:root{
  --neon:#00ffd5;
  --bg1:#020b18;
  --bg2:#041d33;
  --card:rgba(4,18,34,.92);
  --txt:#e9ffff;
  --glow:0 0 18px rgba(0,255,213,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,Segoe UI,Arial;
  background:
    radial-gradient(circle at 20% 20%, #063b7a 0%, transparent 55%),
    radial-gradient(circle at 80% 80%, #0a0033 0%, transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--txt);
  min-height:100vh;
}

.wrapper{
  max-width:1200px;
  margin:20px auto;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(0,255,213,.35);
  border-radius:22px;
  box-shadow:var(--glow);
  overflow:hidden;
}

.header{
  text-align:center;
  padding:18px;
  border-bottom:1px solid rgba(0,255,213,.25);
}
.header h1{
  color:var(--neon);
  text-shadow:var(--glow);
}
.fecha-hora{
  font-size:14px;
  opacity:.85;
}

.content{ padding:24px }

.buscador{
  max-width:520px;
  margin:0 auto 14px;
}
.buscador input{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid rgba(0,255,213,.45);
  background:#000;
  color:var(--neon);
  font-size:16px;
  outline:none;
}

.lista{
  max-width:520px;
  margin:0 auto 16px;
  background:#000;
  border:1px solid rgba(0,255,213,.35);
  border-radius:16px;
  max-height:240px;
  overflow-y:auto;
}
.lista div{
  padding:10px 14px;
  border-bottom:1px solid rgba(0,255,213,.15);
  cursor:pointer;
}
.lista div:hover{
  background:var(--neon);
  color:#000;
}

.info-activa{
  max-width:720px;
  margin:0 auto 14px;
  padding:12px;
  border-radius:16px;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(0,255,213,.35);
  box-shadow:var(--glow);
  text-align:center;
  color:var(--neon);
}

.resultado{
  max-width:100%;
  margin:0 auto;
  background:var(--card);
  border:1px solid rgba(0,255,213,.35);
  border-radius:18px;
  box-shadow:var(--glow);
  padding:14px;
}

.resultado-scroll{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:1000px;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border:1px solid rgba(255,255,255,.15);
  padding:8px;
}
th{
  background:var(--neon);
  color:#000;
  text-align:center;
}

.footer{
  text-align:center;
  font-size:12px;
  padding:12px;
  border-top:1px solid rgba(0,255,213,.25);
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="header">
    <h1>SYSTEM BY GELM — TRANSPORTES 2026</h1>
    <div id="fechaHora" class="fecha-hora"></div>
  </div>

  <div class="content">

    <div class="buscador">
      <input id="buscar" placeholder="Buscar por placa, línea o propietario...">
    </div>

    <div id="lista" class="lista"></div>

    <div id="infoActiva" class="info-activa">
      Registro cargado automáticamente
    </div>

    <!-- TABLA SIEMPRE VISIBLE -->
    <div class="resultado resultado-scroll">
      <table>
        <thead>
          <tr>
            <th>NO. PLACA</th>
            <th>NO. CALCOMANÍA</th>
            <th>CONCESIONARIO</th>
            <th>TEL. DUEÑO</th>
            <th>RUTA</th>
            <th>TEL. PILOTO</th>
            <th>NOMBRE PILOTO</th>
            <th>DPI</th>
            <th>LICENCIA</th>
            <th>TIPO</th>
            <th>DIRECCIÓN</th>
          </tr>
        </thead>
        <tbody id="tablaDatos"></tbody>
      </table>
    </div>

  </div>

  <div class="footer">
    © 2025–2026 — Sistema GELM<br>
    Uso interno autorizado — Transportes
  </div>
</div>

<script>
/* FECHA */
function hora(){
  const d=new Date();
  fechaHora.textContent=
    d.toLocaleDateString("es-GT",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+
    " — "+d.toLocaleTimeString("es-GT");
}
setInterval(hora,1000);hora();

/* CSV */
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSwaUTpai-4dbcMc3imM8jfxPu7Wrzwpi-EqICd1yDRHmFfKAMwMxu8jwXMXqs3GQ/pub?gid=1355305835&single=true&output=csv";

let filas=[];

fetch(URL)
.then(r=>r.text())
.then(t=>{
  filas=t.split("\n").map(l=>l.split(","));
  cargarLista();
  mostrar(filas.find((f,i)=>i>0 && f[1]));
});

function cargarLista(){
  lista.innerHTML="";
  filas.forEach((f,i)=>{
    if(i===0||!f[1]) return;
    const d=document.createElement("div");
    d.textContent=f[1];
    d.onclick=()=>mostrar(f);
    lista.appendChild(d);
  });
}

function mostrar(f){
  infoActiva.innerHTML=`<strong>${f[1]}</strong> — ${f[4]}`;
  const tb=document.getElementById("tablaDatos");
  tb.innerHTML="";
  const tr=document.createElement("tr");
  f.slice(0,11).forEach(c=>{
    const td=document.createElement("td");
    td.textContent=c;
    tr.appendChild(td);
  });
  tb.appendChild(tr);
}
</script>

</body>
</html>
