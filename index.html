<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GELM - SYSTEM</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff66">

<style>
:root{
  --neon:#00ff66;
  --accent:#ff7b00;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}

body{
  min-height:100vh;
  background:radial-gradient(circle at center,#061a13,#000);
  color:#eafff2;
  overflow-x:hidden;
}

/* ===== ÁRBOL DIGITAL ===== */
.tree{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:260px;
  pointer-events:none;
  z-index:0;
}

.tree canvas{
  width:100%;
  height:100%;
}

/* ===== AURORA ===== */
.aurora{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 50% 20%,
    rgba(0,255,102,.25),
    rgba(255,120,0,.15),
    transparent 60%);
  filter:blur(120px);
  z-index:0;
  pointer-events:none;
  transition:opacity .2s;
}

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:3;
  margin:30px auto 20px;
  padding:18px 40px;
  border-radius:999px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,.05);
  border:1px solid var(--neon);
  text-align:center;
  width:fit-content;
  animation:headerPulse 4s infinite alternate;
}

@keyframes headerPulse{
  0%{box-shadow:0 0 15px var(--neon);}
  100%{box-shadow:0 0 40px var(--accent);}
}

.header h1{
  color:var(--neon);
  font-size:18px;
}
.header span{display:block;font-size:12px}
.header .hora{font-size:11px;margin-top:4px}

/* ===== PLAYER ===== */
.player{
  position:relative;
  z-index:3;
  max-width:420px;
  margin:20px auto;
  padding:20px;
  border-radius:20px;
  backdrop-filter:blur(30px);
  background:rgba(255,255,255,.04);
  border:1px solid var(--neon);
  text-align:center;
}

.song-btn{
  width:100%;
  padding:12px;
  border-radius:12px;
  background:#000;
  color:var(--neon);
  border:1px solid var(--neon);
  cursor:pointer;
  font-weight:bold;
}

.controls button{
  margin:10px 6px;
  padding:10px 18px;
  border:none;
  border-radius:10px;
  background:var(--neon);
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

/* ===== MODAL PLAYLIST ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);
  display:none;
  z-index:10;
  padding:20px;
  overflow-y:auto;
}

.modal.active{display:block;}

.modal h2{
  text-align:center;
  margin-bottom:20px;
  color:var(--neon);
}

.song{
  padding:10px;
  margin-bottom:6px;
  border-radius:10px;
  cursor:pointer;
  border:1px solid rgba(0,255,102,.3);
}

.song.active{
  background:rgba(0,255,102,.1);
  box-shadow:0 0 15px var(--accent);
}

/* ===== MENU ===== */
.menu{
  position:relative;
  z-index:3;
  max-width:640px;
  margin:30px auto 60px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  padding:0 16px;
}

.menu a{
  text-decoration:none;
  text-align:center;
  padding:18px;
  border-radius:20px;
  font-weight:800;
  font-size:13px;
  color:var(--neon);
  border:1px solid var(--neon);
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,.03);
  transition:.2s;
}

.menu a.beat{
  box-shadow:0 0 35px var(--accent);
  transform:scale(1.05);
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:18px 10px;
  background:linear-gradient(to bottom,#000,#001a14);
  border-top:2px solid var(--neon);
  font-size:12px;
  position:relative;
  z-index:3;
  color:#00ffff;
}

/* ===== BOTONES FLOTANTES ===== */
.btn-gpt,.btn-2026{
  position:fixed;
  bottom:18px;
  padding:14px 22px;
  border-radius:999px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(20px);
  color:var(--neon);
  font-weight:900;
  text-decoration:none;
  border:1px solid var(--neon);
  box-shadow:0 0 25px var(--neon);
  z-index:4;
}

.btn-gpt{right:18px}
.btn-2026{left:18px}
</style>
</head>

<body>

<div class="aurora" id="aurora"></div>

<div class="tree">
<canvas id="treeCanvas"></canvas>
</div>

<div class="header">
  <h1>GELM - SYSTEM</h1>
  <span id="frase"></span>
  <div id="hora" class="hora"></div>
</div>

<div class="player">
  <button class="song-btn" onclick="openModal()" id="currentSong">Cargando...</button>
  <div class="controls">
    <button onclick="prevSong()">⏮</button>
    <button onclick="togglePlay()">⏯</button>
    <button onclick="nextSong()">⏭</button>
  </div>
</div>

<div class="modal" id="playlistModal">
  <h2>Playlist</h2>
  <div id="playlistContainer"></div>
</div>

<div class="menu">
  <!-- ORDEN PRIORIDAD DIARIA -->
  <a href="https://gelm2mil.github.io/2026/agen2026.html" target="_blank">AGENDA</a>
  <a href="https://gelm2mil.github.io/sistema/B.datos_2026.html" target="_blank">REGISTRO 2026</a>
  <a href="renovacion.html" target="_blank">RENOVACIÓN</a>
  <a href="c_permanentes.html" target="_blank">C. PERMANENTE</a>
  <a href="c_temporal.html" target="_blank">C. TEMPORAL</a>
  <a href="linea_nueva.html" target="_blank">LÍNEA NUEVA</a>
  <a href="traspaso.html" target="_blank">TRASPASO</a>
  <a href="suplentes.html" target="_blank">SUPLENTES</a>
</div>

<footer>
2014 - 2025 | BY GELM | Delegación de Transportes PMT - Chimaltenango
<span>att: —[GELM]—</span>
<span id="footerHora"></span>
</footer>

<a href="transportes_2026.html" target="_blank" class="btn-2026">2026</a>
<a href="https://chat.openai.com/" target="_blank" class="btn-gpt">🤖 GPT</a>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
/* FRASES + RELOJ */
const frases=["Orden y visión.","Disciplina hoy, tranquilidad mañana.","Sistema activo."];
document.getElementById("frase").textContent=frases[Math.floor(Math.random()*frases.length)];
function reloj(){
 const d=new Date();
 document.getElementById("hora").textContent=d.toLocaleString("es-GT");
 document.getElementById("footerHora").textContent=d.toLocaleString("es-GT");
}
setInterval(reloj,1000);reloj();

/* PLAYLIST */
const audio=document.getElementById("audio");
const modal=document.getElementById("playlistModal");
const playlistContainer=document.getElementById("playlistContainer");
const currentSong=document.getElementById("currentSong");
let songs=[],index=0;

fetch("musica.json")
.then(r=>r.json())
.then(data=>{
 data.forEach(item=>{
  if(item.title){
   songs.push(item);
   const div=document.createElement("div");
   div.className="song";
   div.textContent=item.title;
   div.onclick=()=>selectSong(songs.indexOf(item));
   playlistContainer.appendChild(div);
  }
 });
 index=songs.findIndex(s=>s.title.includes("1 Let Her Go"));
 if(index<0) index=0;
 loadSong(index);
 audio.play();
});

function loadSong(i){
 index=i;
 audio.src=songs[i].url;
 currentSong.textContent=songs[i].title+" ▼";
 highlight();
}

function highlight(){
 document.querySelectorAll(".song").forEach((el,i)=>{
  el.classList.toggle("active",i===index);
 });
}

function selectSong(i){loadSong(i);audio.play();closeModal();}
function nextSong(){index=(index+1)%songs.length;loadSong(index);audio.play();}
function prevSong(){index=(index-1+songs.length)%songs.length;loadSong(index);audio.play();}
function togglePlay(){audio.paused?audio.play():audio.pause();}
audio.addEventListener("ended",nextSong);

/* MODAL */
function openModal(){modal.classList.add("active");}
function closeModal(){modal.classList.remove("active");}
modal.onclick=e=>{if(e.target===modal)closeModal();};

/* ÁRBOL REACTIVO */
const treeCanvas=document.getElementById("treeCanvas");
const tctx=treeCanvas.getContext("2d");
treeCanvas.width=window.innerWidth;
treeCanvas.height=260;

function drawTree(level){
 tctx.clearRect(0,0,treeCanvas.width,treeCanvas.height);
 tctx.strokeStyle="#00ff66";
 tctx.lineWidth=2+level*5;
 tctx.beginPath();
 tctx.moveTo(treeCanvas.width/2,260);
 tctx.lineTo(treeCanvas.width/2,150-level*50);
 tctx.stroke();
}
drawTree(0);

const ctxAudio=new AudioContext();
const analyser=ctxAudio.createAnalyser();
const source=ctxAudio.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(ctxAudio.destination);
analyser.fftSize=256;
const dataArray=new Uint8Array(analyser.frequencyBinCount);

function animate(){
 requestAnimationFrame(animate);
 analyser.getByteFrequencyData(dataArray);
 let bass=dataArray[1]/255;
 drawTree(bass);
 document.getElementById("aurora").style.opacity=0.4+bass;
}
animate();

audio.addEventListener("play",()=>ctxAudio.resume());
</script>

</body>
</html>
