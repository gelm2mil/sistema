<body>

<script>
// ======== DATOS ========
let registros = [];
let similares = [];

// ======== CARGAR GOOGLE SHEETS CSV ========
async function cargarExcel() {
    try {
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSwaUTpai-4dbcMc3imM8jfxPu7Wrzwpi-EqICd1yDRHmFfKAMwMxu8jwXMXqs3GQ/pub?gid=1355305835&single=true&output=csv";
        const resp = await fetch(CSV_URL);
        if (!resp.ok) throw new Error("No se pudo descargar el CSV");

        const texto = await resp.text();
        const filas = texto.split("\n").map(l => l.split(",").map(c => c.replace(/^"|"$/g, "").trim()));

        // Buscar inicio de datos con placa M-
        let inicio = filas.findIndex(f =>
            (f[0] || "").toUpperCase().startsWith("M-")
        );
        if (inicio === -1) inicio = 1;

        for (let i = inicio; i < filas.length; i++) {
            const f = filas[i];
            if (!f[0]) continue;
            registros.push({
                placa: (f[0] || "").toUpperCase(),
                calcomania: f[1] || "",
                placaSale: f[2] || "",
                concesionario: f[3] || "",
                telDueno: f[4] || "",
                ruta: f[5] || "",
                telPilotos: f[6] || "",
                nombrePiloto: f[7] || "",
                dpi: f[8] || "",
                documento: f[9] || "",
                licencia: (f[10] || "").toUpperCase(),
                tipoLic: f[11] || ""
            });
        }

        document.getElementById("estado").textContent =
            "Datos cargados correctamente — Registros: " + registros.length;

    } catch (err) {
        document.getElementById("estado").textContent = "Error cargando datos: " + err.message;
        console.error(err);
    }
}

// ======== UTILIDADES ========
function normalizar(txt) {
    return txt.toString().replace(/\s+/g, "").replace(/-/g, "").toUpperCase();
}

function esc(str) {
    return str.toString()
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
}

function construirTabla(r) {
    return `
        <table>
            <tr>
                <th>NO. PLACA</th><th>NO. CALCOMANIA</th><th>PLACA SALE</th>
                <th>CONCESIONARIO (A)</th><th>TEL. DUEÑO</th><th>RUTA</th>
                <th>TEL. PILOTOS</th><th>NOMBRE DEL PILOTO</th><th>DPI</th>
                <th>DOCUMENTO</th><th>LICENCIA</th><th>TIPO LICENCIA</th>
            </tr>
            <tr>
                <td>${esc(r.placa)}</td><td>${esc(r.calcomania)}</td><td>${esc(r.placaSale)}</td>
                <td>${esc(r.concesionario)}</td><td>${esc(r.telDueno)}</td><td>${esc(r.ruta)}</td>
                <td>${esc(r.telPilotos)}</td><td>${esc(r.nombrePiloto)}</td><td>${esc(r.dpi)}</td>
                <td>${esc(r.documento)}</td><td>${esc(r.licencia)}</td><td>${esc(r.tipoLic)}</td>
            </tr>
        </table>`;
}

// ======== BUSCAR ========
function buscar() {
    const texto = document.getElementById("busquedaInput").value.trim();
    const limpio = normalizar(texto);

    const divP = document.getElementById("resultado-principal");
    const divS = document.getElementById("similares-contenador");
    divP.innerHTML = ""; 
    divS.innerHTML = "";
    similares = [];

    if (!texto) return;

    const matches = [];

    registros.forEach(r => {
        let pr = 0;
        if (r.calcomania === texto || normalizar(r.calcomania) === limpio) pr = 100;
        if (r.placa === texto.toUpperCase()) pr = Math.max(pr, 90);
        if (normalizar(r.dpi) === limpio) pr = Math.max(pr, 80);
        if (normalizar(r.licencia) === limpio) pr = Math.max(pr, 70);
        if (normalizar(r.documento) === limpio) pr = Math.max(pr, 60);
        if (pr) matches.push({r, pr});
    });

    if (!matches.length) {
        divP.innerHTML = "<p>No encontrado</p>";
        return;
    }

    matches.sort((a,b)=>b.pr-a.pr);
    divP.innerHTML = construirTabla(matches[0].r);

    similares = matches.slice(1).map(x=>x.r);
    if (similares.length) {
        let ops="<option value=''>-- seleccionar --</option>";
        similares.forEach((r,i)=> {
            ops+=`<option value='${i}'>Calcomanía ${r.calcomania} • ${r.ruta}</option>`;
        });
        divS.innerHTML=`
            <div class="similares-box">
                <select onchange="mostrarSimilar(this.value)">${ops}</select>
            </div>`;
    }
}

function mostrarSimilar(i) {
    if (similares[i]) {
        document.getElementById("resultado-principal").innerHTML =
           construirTabla(similares[i]);
    }
}

// ======== FECHA/HORA ========
function actualizarFechaHora() {
    const d = new Date();
    document.getElementById("fechaHora").textContent =
        d.toLocaleDateString("es-GT",{weekday:"long",year:"numeric",month:"long",day:"numeric"})
        +" — "+d.toLocaleTimeString("es-GT");
}
setInterval(actualizarFechaHora,1000);
actualizarFechaHora();

// ======== INICIO ========
cargarExcel();
</script>
