<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GELM - SYSTEM</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff66">

<style>
:root{
  --neon:#00ff66;
  --glass:rgba(255,255,255,.05);
  --border:rgba(0,255,102,.6);
  --glow:0 0 18px rgba(0,255,102,.7);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}

body{
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.60)),
    url("icons/natural.jpg") no-repeat center center fixed;
  background-size:cover;
  color:#eafff2;
  overflow-x:hidden;
}

/* PARTICULAS */
canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* HEADER */
.header{
  position:relative;
  z-index:2;
  margin:16px auto 12px;
  padding:14px 26px;
  border-radius:999px;
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--border);
  box-shadow:var(--glow);
  width:fit-content;
  text-align:center;
}
.header h1{font-size:18px;font-weight:800;color:var(--neon)}
.header span{display:block;font-size:12px}
.header .hora{margin-top:4px;font-size:11px;color:#b8ffe2}

/* PLAYER */
.player{
  position:relative;
  z-index:2;
  max-width:420px;
  margin:10px auto 20px;
  padding:12px;
  border-radius:18px;
  background:var(--glass);
  backdrop-filter:blur(22px);
  border:1px solid var(--border);
  box-shadow:var(--glow);
}
.player iframe{
  width:100%;
  height:120px;
  border:none;
  border-radius:14px;
}

/* MENU */
.menu{
  position:relative;
  z-index:2;
  max-width:640px;
  margin:0 auto 40px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  padding:0 16px;
}

.menu a{
  position:relative;
  overflow:hidden;
  text-decoration:none;
  text-align:center;
  padding:16px 12px;
  border-radius:18px;
  font-weight:800;
  font-size:13px;
  letter-spacing:.5px;
  color:var(--neon);
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(28px);
  border:1px solid var(--border);
  box-shadow:0 0 16px rgba(0,255,102,.5);
  transition:.3s ease;
}

/* brillo interno glass */
.menu a::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,.08),transparent);
  opacity:.6;
  pointer-events:none;
}

.menu a:hover{
  transform:translateY(-4px);
  box-shadow:0 0 28px rgba(0,255,102,.9);
}

/* FOOTER */
footer{
  position:relative;
  z-index:2;
  text-align:center;
  font-size:11px;
  padding:14px;
  color:#9fffd1;
  border-top:1px solid rgba(0,255,102,.25);
  backdrop-filter:blur(8px);
}

/* BOTONES FLOTANTES */
.btn-gpt,.btn-2026{
  position:fixed;
  bottom:18px;
  padding:14px 20px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(18px);
  color:var(--neon);
  font-weight:900;
  text-decoration:none;
  border:1px solid var(--border);
  box-shadow:var(--glow);
  z-index:3;
}
.btn-gpt{right:18px}
.btn-2026{left:18px}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<script>
/* FRASES */
const frases=[
"Gracias a Dios, un nuevo día.",
"El día avanza y tú lo estás logrando.",
"Disciplina hoy, tranquilidad mañana.",
"Orden, visión y firmeza.",
"Todo trabajo bien hecho deja huella."
];
function rotar(){
 document.getElementById("frase").textContent=
 frases[Math.floor(Math.random()*frases.length)];
}
rotar();setInterval(rotar,1000*60*30);

/* RELOJ */
function reloj(){
 const d=new Date();
 document.getElementById("hora").textContent=
 d.toLocaleDateString("es-GT",{weekday:"long",day:"numeric",month:"long"})+
 " — "+d.toLocaleTimeString("es-GT");
}
reloj();setInterval(reloj,1000);

/* PARTICULAS CIRCUITO SUAVES */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];
for(let i=0;i<70;i++){
 particles.push({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2+1,
  dx:(Math.random()-0.5)*0.2,
  dy:(Math.random()-0.5)*0.2
 });
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle="rgba(0,255,102,.4)";
 particles.forEach(p=>{
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fill();
  p.x+=p.dx;
  p.y+=p.dy;
 });

 for(let i=0;i<particles.length;i++){
  for(let j=i;j<particles.length;j++){
   let dx=particles[i].x-particles[j].x;
   let dy=particles[i].y-particles[j].y;
   let dist=Math.sqrt(dx*dx+dy*dy);
   if(dist<120){
    ctx.strokeStyle="rgba(0,255,102,.08)";
    ctx.beginPath();
    ctx.moveTo(particles[i].x,particles[i].y);
    ctx.lineTo(particles[j].x,particles[j].y);
    ctx.stroke();
   }
  }
 }

 requestAnimationFrame(draw);
}
draw();
</script>
