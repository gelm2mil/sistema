<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SISTEMA OPERATIVO GELM</title>

<style>
:root{
  --neon:#00ffc8;
  --bg-dark:#05010a;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family: Arial, sans-serif;
}

body{
  background:
    radial-gradient(circle at 20% 0%, rgba(0,255,255,0.15), transparent 50%),
    radial-gradient(circle at 80% 0%, rgba(255,0,255,0.15), transparent 55%),
    var(--bg-dark);
  color:#eaeaea;
  min-height:100vh;
}

/* ===== HEADER ===== */
header{
  text-align:center;
  padding:14px 10px;
  border-bottom:1px solid rgba(0,255,200,.4);
  background:rgba(0,0,0,.55);
  box-shadow:0 0 20px rgba(0,255,255,.3);
}

header h1{
  color:var(--neon);
  font-size:18px;
  text-shadow:0 0 12px #00ffff;
}

header small{
  display:block;
  margin-top:4px;
  font-size:12px;
  color:#9fffe6;
}

/* ===== LAYOUT ===== */
.main{
  display:flex;
  min-height:calc(100vh - 120px);
}

/* ===== SIDEBAR ===== */
nav{
  width:72px;
  padding:12px 6px;
  background:rgba(0,0,0,.65);
  border-right:1px solid rgba(0,255,200,.35);
  display:flex;
  flex-direction:column;
  gap:12px;
}

nav a{
  text-decoration:none;
  text-align:center;
  padding:12px 4px;
  border-radius:14px;
  font-size:11px;
  color:var(--neon);

  border:1px solid rgba(0,255,200,.45);
  background:linear-gradient(145deg,#020616,#05001a);

  box-shadow:
    0 0 12px rgba(0,255,255,.4),
    inset 0 0 10px rgba(0,255,255,.15);

  position:relative;
  overflow:hidden;
}

nav a::before{
  content:"";
  position:absolute;
  inset:-2px;
  background:linear-gradient(120deg,
    transparent,
    rgba(0,255,200,.8),
    transparent);
  transform:translateX(-120%);
  animation:scan 3s linear infinite;
}

@keyframes scan{
  to{ transform:translateX(120%); }
}

/* ===== CONTENT ===== */
section{
  flex:1;
  padding:30px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

/* ===== BOTÓN TIPO BUSCAR ===== */
.btn-neon{
  padding:12px 28px;
  border-radius:999px;
  border:none;
  cursor:pointer;

  font-size:15px;
  font-weight:bold;
  color:#000;

  background:radial-gradient(circle at 30% 0, #00ffff, #5f00ff);

  box-shadow:
    0 0 12px rgba(0,255,255,.9),
    0 0 30px rgba(0,0,0,1);

  transition:.2s ease;
}

.btn-neon:hover{
  filter:brightness(1.15);
  transform:scale(1.03);
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:10px;
  font-size:12px;
  color:#6dffe6;
  border-top:1px solid rgba(0,255,200,.3);
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  section{ padding:20px 10px; }
}
</style>
</head>

<body>

<header>
  <h1>SISTEMA OPERATIVO GELM</h1>
  <small>Creado por Genrin Lorenzo Ch.078 — BY GELM</small>
</header>

    <a href="biblia.html">Biblia</a>
  </nav>

  <section>
    <!-- BOTÓN CON ESTILO BUSCAR -->
    <button class="btn-neon">
      Genrin Lorenzo Ch.078
    </button>
  </section>

</div>

<footer>
  © 2026 — GELM | Sistema personal de trabajo y criterio
</footer>

</body>
</html>
