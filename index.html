<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA - GELM</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffc8">

<style>
:root{
  --neon:#00ffc8;
  --bg1:#020b12;
  --bg2:#2b0033;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:#eaffff;
}

/* HEADER */
.header-btn{
  margin:16px auto;
  padding:14px 32px;
  border-radius:999px;
  background:radial-gradient(circle at 30% 0,#00ffff,#5f00ff);
  box-shadow:0 0 16px rgba(0,255,255,.95);
  text-align:center;
  width:fit-content;
}
.header-btn h1{font-size:18px;color:#000;font-weight:bold;}
.header-btn span{display:block;font-size:12px;color:#001010;font-weight:bold;}
.header-btn .hora-header{
  margin-top:6px;
  font-size:11px;
  color:#00ff9c;
  text-shadow:0 0 6px #00ffcc;
  font-weight:bold;
}

/* LAYOUT */
.main{display:flex;min-height:calc(100vh - 140px);}

/* SIDEBAR */
nav{
  width:72px;
  padding:10px 6px;
  background:rgba(0,0,0,.65);
  border-right:1px solid rgba(0,255,200,.35);
  display:flex;
  flex-direction:column;
  gap:12px;
}
nav a{
  text-decoration:none;
  text-align:center;
  padding:12px 4px;
  border-radius:14px;
  color:var(--neon);
  font-size:11px;
  border:1px solid rgba(0,255,200,.45);
  background:linear-gradient(145deg,#020616,#05001a);
  box-shadow:0 0 12px rgba(0,255,255,.45);
}

/* CONTENT */
section{flex:1;padding:30px;}

/* FOOTER */
footer{
  text-align:center;
  padding:12px;
  font-size:11px;
  color:#00ff9c;
  text-shadow:0 0 8px #00ffcc;
  border-top:1px solid rgba(0,255,200,.3);
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header-btn">
  <h1>SISTEMA - GELM</h1>
  <span>todos los derechos de Genrin Lorenzo Ch.078 — BY GELM</span>
  <div id="horaHeader" class="hora-header"></div>
</div>

<div class="main">

<nav>
  <a href="https://gelm2mil.github.io/2026/agen2026.html" target="_blank">Agenda</a>
  <a href="https://gelm2mil.github.io/2026/respaldo.html" target="_blank">Hechos</a>
  <a href="https://gelm2mil.github.io/control/consignacion_pwa.html" target="_blank">Consigna</a>
  <a href="https://gelm2mil.github.io/gelm/" target="_blank">Transportes</a>
  <a href="https://gelm2mil.github.io/buscador/" target="_blank">Multas</a>
  <a href="https://docs.google.com/spreadsheets/d/1c-TyOCJ0TDyDoCt6SVh4bW2lJEtGc1_r81Tl88dO7wA/edit#gid=0" target="_blank">Backup</a>
  <a href="https://gelm2mil.github.io/sistema/leyes/" target="_blank">Leyes</a>
  <a href="https://gelm2mil.github.io/sistema/revisiones.html" target="_blank">revisiones</a>
  <a href="https://gelm2mil.github.io/sistema/B.datos_2026.html" target="_blank">REGISTRO 2026</a>
  <a href="https://gelm2mil.github.io/sistema/leyes/biblia.html" target="_blank">BIBLIA</a>
</nav>

<section></section>

</div>

<footer>
  <div id="fechaHora"></div>
</footer>

<script>
function actualizarFechaHora(){
  const ahora = new Date();
  const opciones = {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  };
  const fecha = ahora.toLocaleDateString("es-ES", opciones);
  const hora = ahora.toLocaleTimeString("es-ES");
  const texto = fecha + " — " + hora;

  const f = document.getElementById("fechaHora");
  const h = document.getElementById("horaHeader");

  if(f) f.textContent = texto;
  if(h) h.textContent = texto;
}

setInterval(actualizarFechaHora, 1000);
actualizarFechaHora();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
