<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leyes - GELM</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle at top,#020b12,#2b0033);
  color:#eaffff;
}
.header{
  text-align:center;
  padding:16px;
  background:rgba(0,0,0,.6);
  border-bottom:1px solid rgba(0,255,200,.3);
}
.header h1{
  margin:0;
  font-size:18px;
  color:#00ffc8;
}
.header span{
  font-size:12px;
  color:#9fffe6;
}
.buscador{
  display:flex;
  gap:10px;
  padding:12px 16px;
  justify-content:center;
  flex-wrap:wrap;
}
.buscador input{
  flex:1;
  max-width:420px;
  padding:12px;
  border-radius:999px;
  border:1px solid #00ffc8;
  background:#020616;
  color:#00ffc8;
  font-size:15px;
}
.buscador button{
  padding:12px 22px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  background:linear-gradient(135deg,#00ffff,#5f00ff);
  color:#000;
  font-weight:bold;
  box-shadow:0 0 12px rgba(0,255,255,.8);
}
.resultados{
  padding:16px;
}
.resultado{
  background:rgba(0,0,0,.6);
  border:1px solid rgba(0,255,200,.3);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}
.resultado h3{
  margin:0 0 6px 0;
  color:#7bffb2;
  font-size:14px;
}
.resultado small{
  color:#9fffe6;
  font-size:12px;
}
.similares{
  margin:10px 0 16px 0;
  text-align:center;
}
.similares select{
  background:#020b40;
  color:#fff;
  border-radius:999px;
  border:1px solid #00ffc8;
  padding:6px 12px;
  min-width:260px;
}
#footer{
  margin-top:30px;
  text-align:center;
  font-size:12px;
  color:#4ee8ff;
  text-shadow:0 0 8px #00fff2;
  padding:12px;
  border-top:1px solid rgba(0,255,200,.3);
}
#footer strong{color:#7bffb2;}
</style>
</head>

<body>

<div class="header">
  <h1>MÓDULO DE LEYES</h1>
  <span>Buscador legal offline — BY GELM</span>
</div>

<!-- BARRAS DE BÚSQUEDA -->
<div class="buscador">
  <input id="q_penal" placeholder="Código Penal (ej: licencia vencida, 184-6)">
  <button onclick="buscarEn('penal')">Buscar</button>
</div>

<div class="buscador">
  <input id="q_reg273" placeholder="Reglamento 273 (ej: prohibición, estacionarse)">
  <button onclick="buscarEn('reg273')">Buscar</button>
</div>

<div class="buscador">
  <input id="q_const" placeholder="Constitución (ej: derecho vida, artículo 3)">
  <button onclick="buscarEn('const')">Buscar</button>
</div>

<div class="buscador">
  <input id="q_transito" placeholder="Ley y Reglamento de Tránsito">
  <button onclick="buscarEn('transito')">Buscar</button>
</div>

<div class="buscador">
  <input id="q_trabajo" placeholder="Código de Trabajo">
  <button onclick="buscarEn('trabajo')">Buscar</button>
</div>

<div class="buscador">
  <input id="q_biblia" placeholder="Biblia">
  <button onclick="buscarEn('biblia')">Buscar</button>
</div>

<div id="resultados" class="resultados"></div>

<!-- PREPARAR CONTENEDOR GLOBAL -->
<script>
window.LEYES_DATA = window.LEYES_DATA || [];
</script>

<!-- BASES LEGALES -->
<script src="constitucion_leyes_data.js"></script>
<script src="codigo_penal.js"></script>
<script src="codigo_trabajo.js"></script>
<script src="codigo_municipal.js"></script>
<script src="ley_transito_2025.js"></script>
<script src="reglamento_273.js"></script>
<script src="biblia_data.js"></script>

<!-- UNIFICAR -->
<script>
window.LEYES = [];
window.LEYES_DATA.forEach(item=>{
  LEYES.push({
    ley: item.fuente || item.ley || "Desconocido",
    articulo: item.articulo || "",
    texto: item.texto || ""
  });
});
</script>

<script>
/* ========= UTILIDADES ========= */
function normalizar(t){
  return (t||"")
    .toString()
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\w\s\-]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function resaltar(texto, palabras){
  let out = texto;
  palabras.forEach(p=>{
    if(!p) return;
    const re = new RegExp(`(${p})`,"ig");
    out = out.replace(re,'<span style="background:yellow;color:#000;border-radius:4px;padding:1px 3px">$1</span>');
  });
  return out;
}

/* ========= MOTOR ========= */
let ultimos = [];
let ultimoPrincipal = null;

function buscarEn(tipo){
  const map = {
    penal:   { q: "q_penal",    filtro: "penal" },
    reg273:  { q: "q_reg273",   filtro: "273" },
    const:   { q: "q_const",    filtro: "constitucion" },
    transito:{ q: "q_transito", filtro: "transito" },
    trabajo: { q: "q_trabajo",  filtro: "trabajo" },
    biblia:  { q: "q_biblia",   filtro: "biblia" }
  };

  const cfg = map[tipo];
  const raw = document.getElementById(cfg.q).value || "";
  const cont = document.getElementById("resultados");
  cont.innerHTML = "";

  if(!raw.trim()){
    cont.innerHTML = "<p>Escribe una palabra, frase o número.</p>";
    return;
  }

  const buscado = normalizar(raw);
  const palabras = buscado.split(" ").filter(Boolean);

  // Filtrar por módulo + coincidencias por TODAS las palabras
  const data = LEYES.filter(x=>{
    const ley = normalizar(x.ley);
    if(!ley.includes(cfg.filtro)) return false;

    const cuerpo = normalizar((x.articulo||"") + " " + (x.texto||""));
    return palabras.every(p=> cuerpo.includes(p));
  });

  if(!data.length){
    cont.innerHTML = "<p>No se encontraron coincidencias.</p>";
    return;
  }

  // Principal = el primero; resto = similares
  ultimoPrincipal = data[0];
  ultimos = data.slice(1);

  pintarResultado(ultimoPrincipal, palabras);

  if(ultimos.length){
    const div = document.createElement("div");
    div.className = "similares";
    let opts = `<option value="">— SIMILARES (${ultimos.length}) —</option>`;
    ultimos.forEach((r,i)=>{
      const label = `${r.ley} — ${r.articulo}`;
      opts += `<option value="${i}">${label}</option>`;
    });
    div.innerHTML = `
      <select onchange="mostrarSimilar(this.value)">
        ${opts}
      </select>
    `;
    cont.appendChild(div);
  }
}

function pintarResultado(r, palabras){
  const cont = document.getElementById("resultados");
  cont.innerHTML = "";

  const div = document.createElement("div");
  div.className = "resultado";
  const texto = resaltar(r.texto||"", palabras);
  div.innerHTML = `
    <h3>${r.ley} — ${r.articulo}</h3>
    <small>${texto}</small>
  `;
  cont.appendChild(div);
}

function mostrarSimilar(idx){
  const i = parseInt(idx,10);
  if(isNaN(i) || !ultimos[i]) return;
  const raw = document.querySelector(".buscador input:focus")?.value || "";
  const palabras = normalizar(raw).split(" ").filter(Boolean);
  pintarResultado(ultimos[i], palabras);
}
</script>

<div id="footer">
  <div>
    2014 - 2025 | <strong>BY GELM</strong> | Delegación de Transportes PMT - Chimaltenango<br>
    att: ---[GELM]---
  </div>
  <div id="fechaHora"></div>
</div>

<script>
function actualizarFechaHora(){
  const ahora = new Date();
  const opciones = {
    weekday:"long", year:"numeric", month:"long", day:"numeric"
  };
  const fecha = ahora.toLocaleDateString("es-ES", opciones);
  const hora = ahora.toLocaleTimeString("es-ES");
  const el = document.getElementById("fechaHora");
  if(el) el.textContent = fecha + " — " + hora;
}
setInterval(actualizarFechaHora,1000);
actualizarFechaHora();
</script>

</body>
</html>
