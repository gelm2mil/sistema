<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA - GELM</title>

<style>
:root{
  --neon:#00ffc8;
  --bg1:#020b12;
  --bg2:#2b0033;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  background: linear-gradient(135deg,var(--bg1),var(--bg2));
  color:#eaffff;
}

/* ===== HEADER BOTÓN ===== */
.header-btn{
  margin:16px auto;
  padding:14px 32px;
  border-radius:999px;
  border:none;
  cursor:default;
  background:radial-gradient(circle at 30% 0,#00ffff,#5f00ff);
  box-shadow:
    0 0 16px rgba(0,255,255,.95),
    0 0 40px rgba(0,0,0,1);
  text-align:center;
  width:fit-content;
}

.header-btn h1{
  font-size:18px;
  color:#000;
  font-weight:bold;
  text-shadow:0 0 4px #00ffff;
}

.header-btn span{
  display:block;
  margin-top:4px;
  font-size:12px;
  color:#001010;
  font-weight:bold;
}

/* ===== LAYOUT ===== */
.main{
  display:flex;
  min-height:calc(100vh - 120px);
}

/* ===== SIDEBAR ===== */
nav{
  width:72px;
  padding:10px 6px;
  background:rgba(0,0,0,.65);
  border-right:1px solid rgba(0,255,200,.35);
  display:flex;
  flex-direction:column;
  gap:12px;
}

nav a{
  text-decoration:none;
  text-align:center;
  padding:12px 4px;
  border-radius:14px;
  color:var(--neon);
  font-size:11px;
  border:1px solid rgba(0,255,200,.45);
  background:linear-gradient(145deg,#020616,#05001a);
  box-shadow:
    0 0 12px rgba(0,255,255,.45),
    inset 0 0 10px rgba(0,255,255,.15);
  position:relative;
  overflow:hidden;
}

nav a::before{
  content:"";
  position:absolute;
  inset:-2px;
  background:linear-gradient(120deg,
    transparent,
    rgba(0,255,200,.6),
    transparent
  );
  transform:translateX(-120%);
  animation:scan 3s linear infinite;
}

@keyframes scan{
  to{ transform:translateX(120%); }
}

/* ===== CONTENT ===== */
section{
  flex:1;
  padding:30px;
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:10px;
  font-size:11px;
  color:#7dffee;
  border-top:1px solid rgba(0,255,200,.3);
}
</style>
</head>

<body>

<!-- BOTÓN HEADER -->
<div class="header-btn">
  <h1>SISTEMA - GELM</h1>
  <span>todos los derechso de Genrin Lorenzo Ch.078 — BY GELM</span>
</div>

    <a href="https://gelm2mil.github.io/2026/respaldo.html">Hechos</a>

    <a href="https://gelm2mil.github.io/gelm/">transportes</a>
     <a href="https://gelm2mil.github.io/buscador/">multas</a>
    <a href="#">Leyes</a>
    <a href="#">Biblia</a>
  </nav>

  <!-- CONTENIDO -->
  <section>
    <!-- aquí irán los módulos -->
  </section>

</div>

<footer>

</footer>

</body>
</html>
