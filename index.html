<title>GELM - SYSTEM</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff66">

<style>
:root{
  --neon:#00ff66;
  --bg1:#020b12;
  --bg2:#1a0022;
  --card:rgba(0,0,0,.65);
  --glow:0 0 18px rgba(0,255,102,.55);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}

body{
  min-height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:#eafff2;
}

/* ===== HEADER ===== */
.header{
  margin:14px auto 10px;
  padding:14px 26px;
  border-radius:999px;
  background:radial-gradient(circle at 30% 0,#00ffcc,#00ff66);
  box-shadow:var(--glow);
  width:fit-content;
  text-align:center;
  color:#000;
}
.header h1{font-size:18px;font-weight:800}
.header span{
  display:block;
  font-size:12px;
  font-weight:700;
}
.header .hora{
  margin-top:4px;
  font-size:11px;
  color:#003311;
  font-weight:700;
}

/* ===== PLAYER ===== */
.player{
  max-width:420px;
  margin:10px auto 18px;
  padding:10px;
  border-radius:16px;
  background:var(--card);
  border:1px solid rgba(0,255,102,.45);
  box-shadow:var(--glow);
}
.player iframe{
  width:100%;
  height:120px;
  border:none;
  border-radius:12px;
}

/* ===== GRID BOTONES ===== */
.menu{
  max-width:620px;
  margin:0 auto 40px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:0 14px;
}
.menu a{
  text-decoration:none;
  text-align:center;
  padding:14px 10px;
  border-radius:16px;
  color:var(--neon);
  font-weight:800;
  font-size:13px;
  letter-spacing:.5px;
  background:linear-gradient(145deg,#020b12,#050014);
  border:1px solid rgba(0,255,102,.45);
  box-shadow:0 0 14px rgba(0,255,102,.45);
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  font-size:11px;
  padding:12px;
  color:#00ff99;
  border-top:1px solid rgba(0,255,102,.25);
}

/* ===== GPT ===== */
.btn-gpt{
  position:fixed;
  bottom:18px;
  right:18px;
  padding:12px 18px;
  border-radius:999px;
  background:radial-gradient(circle at 30% 0,#00ffcc,#00ff66);
  color:#000;
  font-weight:900;
  text-decoration:none;
  box-shadow:var(--glow);
}
  /* ===== BOTÓN 2026 ===== */
.btn-2026{
  position:fixed;
  bottom:18px;
  left:18px;
  padding:12px 18px;
  border-radius:999px;
  background:radial-gradient(circle at 30% 0,#00ffcc,#00ff66);
  color:#000;
  font-weight:900;
  text-decoration:none;
  box-shadow:var(--glow);
  z-index:9999;
}
</style>
</head>

<script>
const frases=[
"Gracias a Dios, un nuevo día.",
"El día avanza y tú lo estás logrando.",
"Disciplina hoy, tranquilidad mañana.",
"Orden, visión y firmeza.",
"Todo trabajo bien hecho deja huella."
];
function rotar(){
 document.getElementById("frase").textContent=
 frases[Math.floor(Math.random()*frases.length)];
}
rotar();setInterval(rotar,1000*60*30);

function reloj(){
 const d=new Date();
 document.getElementById("hora").textContent=
 d.toLocaleDateString("es-GT",{weekday:"long",day:"numeric",month:"long"})+
 " — "+d.toLocaleTimeString("es-GT");
}
reloj();setInterval(reloj,1000);
</script>
