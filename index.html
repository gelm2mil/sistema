<style>
:root{
  --neon:#00ff66;
  --neonSoft:rgba(0,255,102,.6);
  --glow:0 0 12px rgba(0,255,102,.7);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}

body{
  min-height:100vh;
  background:url("icons/natural.jpg") no-repeat center center fixed;
  background-size:cover;
  color:#eafff2;
  overflow-x:hidden;
}

/* Overlay oscuro elegante */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.4),rgba(0,0,0,.75));
  z-index:0;
}

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:2;
  margin:18px auto 14px;
  padding:16px 32px;
  border-radius:999px;
  text-align:center;
  border:1px solid var(--neonSoft);
  backdrop-filter:blur(10px);
  background:transparent;
  box-shadow:var(--glow);
  animation:pulse 3s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 10px rgba(0,255,102,.4)}
  50%{box-shadow:0 0 22px rgba(0,255,102,.9)}
  100%{box-shadow:0 0 10px rgba(0,255,102,.4)}
}
.header h1{
  font-size:18px;
  font-weight:900;
  color:var(--neon);
  text-shadow:0 0 8px var(--neon);
}
.header span{font-size:12px}
.header .hora{font-size:11px;margin-top:4px}

/* ===== PLAYER ===== */
.player{
  position:relative;
  z-index:2;
  max-width:420px;
  margin:12px auto 20px;
  padding:12px;
  border-radius:20px;
  border:1px solid var(--neonSoft);
  backdrop-filter:blur(12px);
  background:transparent;
  box-shadow:var(--glow);
}
.player iframe{
  width:100%;
  height:120px;
  border:none;
  border-radius:14px;
}

/* ===== BOTONES ===== */
.menu{
  position:relative;
  z-index:2;
  max-width:620px;
  margin:0 auto 60px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  padding:0 16px;
}

.menu a{
  text-decoration:none;
  text-align:center;
  padding:16px 10px;
  border-radius:20px;
  font-weight:800;
  font-size:13px;
  letter-spacing:.5px;
  color:var(--neon);
  background:transparent;
  border:1px solid var(--neonSoft);
  backdrop-filter:blur(8px);
  box-shadow:0 0 10px rgba(0,255,102,.4);
  transition:.2s ease;
}

.menu a:hover{
  box-shadow:0 0 25px rgba(0,255,102,1);
}

.menu a:active{
  transform:scale(.94);
  box-shadow:0 0 35px rgba(0,255,102,1);
}

/* ===== FOOTER ===== */
footer{
  position:relative;
  z-index:2;
  text-align:center;
  padding:16px 10px;
  font-size:12px;
  background:linear-gradient(to bottom, rgba(0,0,0,.8), rgba(0,0,0,.95));
  color:#00ffff;
  border-top:2px solid #00ffff;
  text-shadow:0 0 10px rgba(0,255,255,.9);
}

/* ===== BOTONES FLOTANTES ===== */
.btn-gpt,.btn-2026{
  position:fixed;
  bottom:18px;
  padding:14px 22px;
  border-radius:999px;
  background:transparent;
  backdrop-filter:blur(12px);
  color:var(--neon);
  font-weight:900;
  text-decoration:none;
  border:1px solid var(--neonSoft);
  box-shadow:var(--glow);
  z-index:3;
  transition:.2s ease;
}
.btn-gpt{right:18px}
.btn-2026{left:18px}

.btn-gpt:active,.btn-2026:active{
  transform:scale(.9);
  box-shadow:0 0 35px rgba(0,255,102,1);
}
</style>
</head>

<script>
const frases=[
"Gracias a Dios, un nuevo día.",
"Disciplina hoy, tranquilidad mañana.",
"Orden, visión y firmeza.",
"Todo trabajo bien hecho deja huella."
];
function rotar(){
 document.getElementById("frase").textContent=
 frases[Math.floor(Math.random()*frases.length)];
}
rotar();setInterval(rotar,1000*60*30);

function reloj(){
 const d=new Date();
 document.getElementById("hora").textContent=
 d.toLocaleDateString("es-GT",{weekday:"long",day:"numeric",month:"long"})+
 " — "+d.toLocaleTimeString("es-GT");
}
