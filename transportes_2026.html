<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLICIA MUNICIPAL DE TRANSITO — TRANSPORTES — BY GELM</title>

<style>
/* === TODO EL CSS ORIGINAL, SIN CAMBIOS === */
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    color:#eee;
    background:#05010a;
}
.contenedor{max-width:1200px;margin:auto;}
.similares-box{margin-top:10px;color:#a8ffe8}
.similares-box select{padding:5px}
</style>
</head>

<body>

<div class="contenedor">

<div id="estado">Cargando datos desde Google Sheets...</div>

<div class="buscador">
<input id="busquedaInput" placeholder'search' placeholder="Placa, DPI, licencia o calcomanía">
<button onclick="buscar()">Buscar</button>
</div>

<div id="resultado">
    <div id="resultado-principal"></div>
    <div id="similares-contenedor"></div>
</div>

</div>

<script>
let registros = [];
let similares = [];

/* ========= CARGAR GOOGLE SHEETS (CSV) ========= */
async function cargarGoogleSheetsCSV(){
    try{
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSwaUTpai-4dbcMc3imM8jfxPu7Wrzwpi-EqICd1yDRHmFfKAMwMxu8jwXMXqs3GQ/pub?gid=1355305835&single=true&output=csv";
        const resp = await fetch(url);
        if(!resp.ok) throw new Error("No se pudo cargar Google Sheets");

        const texto = await resp.text();
        const filas = texto.split("\n").map(f=>f.split(","));

        let inicio = filas.findIndex(f =>
            (f[0]||"").toUpperCase().startsWith("M-")
        );

        for(let i=inicio;i<filas.length;i++){
            const f = filas[i];
            if(!f[0]) continue;

            registros.push({
                placa: (f[0]||"").trim().toUpperCase(),
                calcomania:(f[1]||"").trim(),
                placaSale:(f[2]||"").trim(),
                concesionario:(f[3]||"").trim(),
                telDueno:(f[4]||"").trim(),
                ruta:(f[5]||"").trim(),
                telPilotos:(f[6]||"").trim(),
                nombrePiloto:(f[7]||"").trim(),
                dpi:(f[8]||"").trim(),
                documento:(f[9]||"").trim(),
                licencia:(f[10]||"").trim().toUpperCase(),
                tipoLic:(f[11]||"").trim(),
                direccion:(f[12]||"").trim()
            });
        }

        document.getElementById("estado").textContent =
            "Datos cargados correctamente — Registros: " + registros.length;

    }catch(e){
        document.getElementById("estado").textContent = "Error: " + e.message;
        console.error(e);
    }
}

/* ========= UTILIDADES ========= */
function normalizar(t){
    return t.replace(/\s|-/g,"").toUpperCase();
}
function esc(t){
    return (t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}

/* ========= TABLA ========= */
function construirTabla(r){
return `
<table border="1">
<tr>
<th>PLACA</th><th>CALCOMANIA</th><th>CONCESIONARIO</th><th>RUTA</th>
<th>TEL PILOTO</th><th>NOMBRE PILOTO</th><th>DPI</th><th>DOCUMENTO</th>
<th>LICENCIA</th><th>TIPO</th><th>DIRECCIÓN</th>
</tr>
<tr>
<td>${esc(r.placa)}</td>
<td>${esc(r.calcomania)}</td>
<td>${esc(r.concesionario)}</td>
<td>${esc(r.ruta)}</td>
<td>${esc(r.telPilotos)}</td>
<td>${esc(r.nombrePiloto)}</td>
<td>${esc(r.dpi)}</td>
<td>${esc(r.documento)}</td>
<td>${esc(r.licencia)}</td>
<td>${esc(r.tipoLic)}</td>
<td>${esc(r.direccion)}</td>
</tr>
</table>`;
}

/* ========= BUSCAR (LÓGICA ORIGINAL DEL TATA) ========= */
function buscar(){
    const texto = document.getElementById("busquedaInput").value.trim();
    const limpio = normalizar(texto);
    const divP = document.getElementById("resultado-principal");
    const divS = document.getElementById("similares-contenedor");
    divS.innerHTML="";
    similares=[];

    const coincidencias=[];

    registros.forEach(r=>{
        let p=0;
        if(r.calcomania===texto||r.calcomania===limpio){
            p = r.ruta.toUpperCase().includes("CASCO") ? 100 : 90;
        }
        if(r.placa===texto.toUpperCase()) p=Math.max(p,80);
        if(normalizar(r.dpi)===limpio) p=Math.max(p,70);
        if(normalizar(r.licencia)===limpio) p=Math.max(p,60);
        if(normalizar(r.documento)===limpio) p=Math.max(p,50);

        if(p>0) coincidencias.push({r,p});
    });

    if(!coincidencias.length){
        divP.innerHTML="No encontrado";
        return;
    }

    coincidencias.sort((a,b)=>b.p-a.p);
    divP.innerHTML = construirTabla(coincidencias[0].r);

    if(coincidencias.length>1){
        similares = coincidencias.slice(1).map(x=>x.r);
        let ops='<option value="">-- seleccionar --</option>';
        similares.forEach((r,i)=>{
            ops+=`<option value="${i}">Calcomanía ${r.calcomania} • ${r.ruta}</option>`;
        });
        divS.innerHTML=`
        <div class="similares-box">
        SIMILARES:
        <select onchange="mostrarSimilar(this.value)">
        ${ops}
        </select>
        </div>`;
    }
}

function mostrarSimilar(i){
    if(i==="")return;
    document.getElementById("resultado-principal").innerHTML =
        construirTabla(similares[i]);
}

/* ========= INICIO ========= */
cargarGoogleSheetsCSV();
</script>

</body>
</html>
