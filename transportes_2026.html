<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GELM PMT PRO</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#05010a;
    color:#fff;
}

.contenedor{
    max-width:600px;
    margin:auto;
    padding:15px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#00ffc8;
    font-weight:bold;
}

.card{
    background:#0a0a0a;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
    box-shadow:0 0 10px rgba(0,255,255,.4);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.label{
    font-size:11px;
    color:#00ffc8;
}

.valor{
    font-size:14px;
    margin-bottom:6px;
}

.titulo{
    text-align:center;
    color:#00ffc8;
    font-weight:bold;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="contenedor">

<div class="titulo">SISTEMA PMT GELM</div>

<input id="busquedaInput" placeholder="Placa, DPI, licencia, documento o calcomanía">
<button onclick="buscar()">Buscar</button>

<div id="resultado"></div>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSwaUTpai-4dbcMc3imM8jfxPu7Wrzwpi-EqICd1BSN7gxmPWYCAKJgA9aH4yNuERpTvs4uiX/pub?gid=1355305835&single=true&output=csv";

let registros=[];

function normalizar(t){
    return (t||"").toString().replace(/[\s-]/g,"").toUpperCase();
}

async function cargarDatos(){
    const r=await fetch(CSV_URL);
    const t=await r.text();
    const filas=t.split("\n").map(f=>f.split(","));

    for(let i=1;i<filas.length;i++){
        const f=filas[i];
        if(!f[0]) continue;

        registros.push({
            placa:f[0],
            calcomania:f[1],
            placaSale:f[2],
            concesionario:f[3],
            telDueno:f[4],
            ruta:f[5],
            telPilotos:f[6],
            nombrePiloto:f[7],
            dpi:f[8],
            documento:f[9],
            licencia:f[10],
            tipoLic:f[11]
        });
    }
}

function construirCard(r){
return `
<div class="card">

<div class="grid">
<div><div class="label">PLACA</div><div class="valor">${r.placa}</div></div>
<div><div class="label">CALCOMANIA</div><div class="valor">${r.calcomania}</div></div>

<div><div class="label">PLACA SALE</div><div class="valor">${r.placaSale}</div></div>
<div><div class="label">CONCESIONARIO</div><div class="valor">${r.concesionario}</div></div>

<div><div class="label">TEL DUEÑO</div><div class="valor">${r.telDueno}</div></div>
<div><div class="label">RUTA</div><div class="valor">${r.ruta}</div></div>

<div><div class="label">TEL PILOTO</div><div class="valor">${r.telPilotos}</div></div>
<div><div class="label">PILOTO</div><div class="valor">${r.nombrePiloto}</div></div>

<div><div class="label">DPI</div><div class="valor">${r.dpi}</div></div>
<div><div class="label">DOCUMENTO</div><div class="valor">${r.documento}</div></div>

<div><div class="label">LICENCIA</div><div class="valor">${r.licencia}</div></div>
<div><div class="label">TIPO</div><div class="valor">${r.tipoLic}</div></div>
</div>

</div>
`;
}

function buscar(){
    const txt=document.getElementById("busquedaInput").value.trim();
    const limpio=normalizar(txt);

    if(!txt) return;

    let mejor=null;
    let mejorPuntaje=0;

    registros.forEach(r=>{
        let p=0;

        if(normalizar(r.calcomania)===limpio) p=100;
        if(normalizar(r.placa)===limpio) p=Math.max(p,90);
        if(normalizar(r.dpi)===limpio) p=Math.max(p,80);
        if(normalizar(r.licencia)===limpio) p=Math.max(p,70);
        if(normalizar(r.documento)===limpio) p=Math.max(p,60);

        if(p>mejorPuntaje){
            mejor=r;
            mejorPuntaje=p;
        }
    });

    if(!mejor){
        document.getElementById("resultado").innerHTML="No encontrado";
        return;
    }

    document.getElementById("resultado").innerHTML=construirCard(mejor);
}

cargarDatos();
</script>

</body>
</html>
