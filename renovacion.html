<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM BY GELM — RENOVACIÓN 2026</title>

<style>
:root{
  --neon:#00ffd5;
  --bg1:#020b18;
  --bg2:#041d33;
  --card:rgba(4,18,34,.92);
  --txt:#e9ffff;
  --glow:0 0 18px rgba(0,255,213,.35);
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Segoe UI",system-ui;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--txt);
  min-height:100vh;
}

/* ===== CONTENEDOR PRINCIPAL ===== */
.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:20px;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(0,255,213,.35);
  border-radius:22px;
  box-shadow:var(--glow);
}

/* ===== HEADER ===== */
.header{
  text-align:center;
  padding-bottom:15px;
  border-bottom:1px solid rgba(0,255,213,.25);
}
.header h1{
  color:var(--neon);
  text-shadow:var(--glow);
}
.header .fecha{
  font-size:13px;
  opacity:.85;
}

/* ===== BUSCADOR ===== */
.busqueda{
  margin:25px auto 10px;
  max-width:420px;
}
.busqueda input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(0,255,213,.45);
  background:#000;
  color:var(--neon);
  font-size:15px;
  outline:none;
}

/* ===== LISTA SIMILARES ===== */
.similares{
  max-width:420px;
  margin:10px auto;
  background:#000;
  border-radius:14px;
  border:1px solid rgba(0,255,213,.35);
  max-height:180px;
  overflow-y:auto;
}
.similares div{
  padding:12px;
  border-bottom:1px solid rgba(0,255,213,.15);
  cursor:pointer;
}
.similares div:hover{
  background:rgba(0,255,213,.2);
}

/* ===== BARRA RESUMEN ===== */
.barra-resumen{
  margin:18px auto;
  padding:14px;
  max-width:700px;
  background:#000;
  border-radius:14px;
  border:1px solid rgba(0,255,213,.45);
  text-align:center;
  color:var(--neon);

  overflow-x:auto;
  white-space:nowrap;
  -webkit-overflow-scrolling:touch;
}

/* ===== TABLA ===== */
.tabla-scroll{
  margin-top:18px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
table{
  min-width:800px;
  border-collapse:collapse;
  background:#000;
  border-radius:14px;
  overflow:hidden;
}
th,td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid rgba(0,255,213,.2);
}
th{
  background:linear-gradient(90deg,#00ffd5,#00bfa5);
  color:#000;
}

/* ===== FOOTER ===== */
.footer{
  margin-top:25px;
  padding-top:12px;
  text-align:center;
  font-size:12px;
  opacity:.8;
  border-top:1px solid rgba(0,255,213,.25);
}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <h1>SYSTEM BY GELM — RENOVACIÓN 2026</h1>
    <div id="fechaHora" class="fecha"></div>
  </div>

  <!-- BUSCADOR -->
  <div class="busqueda">
    <input id="buscar" placeholder="Buscar placa..." oninput="filtrar()">
  </div>

  <!-- SIMILARES -->
  <div id="lista" class="similares"></div>

  <!-- RESUMEN -->
  <div id="resumen" class="barra-resumen">
    Seleccione una placa
  </div>

  <!-- TABLA -->
  <div class="tabla-scroll">
    <table id="tabla">
      <thead>
        <tr>
          <th>Dato</th>
          <th>Dato</th>
          <th>Dato</th>
          <th>Dato</th>
          <th>Dato</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    © 2025–2026 — Sistema GELM<br>
    Desarrollo, diseño y propiedad intelectual reservada — BY GELM<br>
    Uso interno autorizado
  </div>

</div>

<script>
/* ===== FECHA ===== */
function actualizarHora(){
  const f=new Date();
  document.getElementById("fechaHora").textContent=
    f.toLocaleDateString("es-GT",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+
    " — "+f.toLocaleTimeString("es-GT");
}
setInterval(actualizarHora,1000);
actualizarHora();

/* ===== DATOS DEMO (tu Sheet ya lo conectas igual que antes) ===== */
const datos=[
 {id:24,placa:"C-985BZH",fecha:"04/02/2026",tipo:"RENOVACION 2026",obs:"ESCOLAR 12-2025"},
 {id:12,placa:"C-001CBC",fecha:"01/02/2026",tipo:"RENOVACION 2026",obs:"PARTICULAR"},
 {id:7,placa:"C-423BLD",fecha:"30/01/2026",tipo:"RENOVACION 2026",obs:"CARGA"}
];

function filtrar(){
  const q=document.getElementById("buscar").value.toUpperCase();
  const lista=document.getElementById("lista");
  lista.innerHTML="";
  datos.filter(d=>d.placa.includes(q)).forEach(d=>{
    const div=document.createElement("div");
    div.textContent=d.placa;
    div.onclick=()=>mostrar(d);
    lista.appendChild(div);
  });
}

function mostrar(d){
  document.getElementById("resumen").textContent=
    `${d.placa} — ${d.tipo} | Fecha: ${d.fecha} | ${d.obs}`;

  const tb=document.querySelector("#tabla tbody");
  tb.innerHTML=`
    <tr>
      <td>${d.id}</td>
      <td>${d.placa}</td>
      <td>${d.fecha}</td>
      <td>${d.tipo}</td>
      <td>${d.obs}</td>
    </tr>`;
}
</script>

</body>
</html>
