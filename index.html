<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SISTEMA OPERATIVO GELM</title>

<style>
:root{
  --neon:#00ffc8;
  --bg1:#020b12;
  --bg2:#2b0033;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  background: linear-gradient(135deg,var(--bg1),var(--bg2));
  color:#eaffff;
}

/* ===== HEADER ===== */
header{
  padding:14px;
  text-align:center;
  border-bottom:1px solid rgba(0,255,200,.4);
  box-shadow:0 0 20px rgba(0,255,255,.3);
}

header h1{
  color:var(--neon);
  text-shadow:0 0 12px #00ffff;
  font-size:18px;
}

header small{
  display:block;
  margin-top:4px;
  font-size:12px;
  color:#9ff;
}

/* ===== LAYOUT ===== */
.main{
  display:flex;
  min-height:calc(100vh - 90px);
}

/* ===== SIDEBAR ===== */
nav{
  width:72px;
  padding:10px 6px;
  background:rgba(0,0,0,.65);
  border-right:1px solid rgba(0,255,200,.35);
  display:flex;
  flex-direction:column;
  gap:12px;
}

nav a{
  text-decoration:none;
  text-align:center;
  padding:12px 4px;
  border-radius:14px;
  color:var(--neon);
  font-size:11px;
  border:1px solid rgba(0,255,200,.45);
  background:linear-gradient(145deg,#020616,#05001a);
  box-shadow:
    0 0 12px rgba(0,255,255,.45),
    inset 0 0 10px rgba(0,255,255,.15);
  position:relative;
  overflow:hidden;
}

nav a::before{
  content:"";
  position:absolute;
  inset:-2px;
  background:linear-gradient(120deg,
    transparent,
    rgba(0,255,200,.6),
    transparent
  );
  transform:translateX(-120%);
  animation:scan 3s linear infinite;
}

@keyframes scan{
  to{ transform:translateX(120%); }
}

/* ===== CONTENT ===== */
section{
  flex:1;
  padding:30px;
}

/* ===== BOTÓN NEON (TIPO BUSCAR) ===== */
.btn-neon{
  padding:12px 28px;
  border-radius:999px;
  border:none;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  color:#000;
  background:radial-gradient(circle at 30% 0,#00ffff,#5f00ff);
  box-shadow:
    0 0 14px rgba(0,255,255,.9),
    0 0 35px rgba(0,0,0,1);
  transition:.2s ease;
}

.btn-neon:hover{
  filter:brightness(1.15);
  transform:scale(1.04);
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:10px;
  font-size:11px;
  color:#7dffee;
  border-top:1px solid rgba(0,255,200,.3);
}
</style>
</head>

<body>

<header>
  <h1>SISTEMA OPERATIVO GELM</h1>
  <small>Creado por Genrin Lorenzo Ch.078 — BY GELM</small>
</header>

<div class="main">

  <!-- SIDEBAR -->
  <nav>
    <a href="#">Agenda</a>
    <a href="#">Hechos</a>
    <a href="#">Consigna</a>
    <a href="#">Control</a>
    <a href="#">Leyes</a>
    <a href="#">Biblia</a>
  </nav>

  <!-- CONTENIDO CENTRAL (VACÍO A PROPÓSITO) -->
  <section>
    <button class="btn-neon">
      Genrin Lorenzo Ch.078
    </button>
  </section>

</div>

<footer>
  © 2026 — GELM | Sistema personal de trabajo y criterio
</footer>

</body>
</html>
