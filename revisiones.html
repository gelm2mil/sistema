<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo Revisiones 2026 - GELM</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    color:#eee;
    background:
        radial-gradient(circle at 20% 0%, rgba(0,255,255,.2), transparent 50%),
        radial-gradient(circle at 80% 0%, rgba(255,0,255,.18), transparent 55%),
        #05010a;
    background-attachment:fixed;
}
.contenedor{
    max-width:1100px;
    margin:auto;
    background:rgba(0,0,0,.82);
    border-radius:18px;
    padding:20px;
    box-shadow:0 0 18px rgba(0,255,255,.5),0 0 50px #000;
    border:1px solid rgba(0,255,255,.35);
}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}
.logo{
    width:70px;
    height:70px;
    border-radius:14px;
    padding:6px;
    background:radial-gradient(circle at 30% 0, rgba(0,255,120,.3), rgba(0,255,255,.05));
    box-shadow:0 0 10px rgba(0,255,120,.9),0 0 25px #000;
    border:1px solid rgba(0,255,180,.9);
}
.logo img{width:100%;height:auto;}
.titulo{text-align:center;flex:1}
.t1{color:#00ffc8;font-size:20px;font-weight:bold;text-shadow:0 0 10px #00ffff}
.t2{color:#ffdf5e;font-size:14px;margin-top:4px}
#estado{text-align:center;color:#aaa;margin:10px 0}
.barra{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
}
select,input,button{
    padding:10px 14px;
    border-radius:999px;
    border:1px solid #00ffc8;
    background:#050513;
    color:#00ffc8;
    font-size:15px;
}
button{
    background:radial-gradient(circle at 30% 0,#00ffff,#5f00ff);
    color:#000;
    font-weight:bold;
    cursor:pointer;
}
#resultado{margin-top:15px}
table{border-collapse:collapse;width:100%;background:#141414}
th,td{border:1px solid #333;padding:6px 8px;font-size:13px}
th{background:#00ffc8;color:#000}
.similares-box{margin-top:10px;color:#a8ffe8;font-size:12px}
.similares-box select{min-width:260px}
.footer{margin-top:18px;text-align:center;font-size:12px;color:#4ee8ff}
</style>
</head>

<body>
<div class="contenedor">

<div class="header">
    <div class="logo"><img src="icons/icon-192.png"></div>
    <div class="titulo">
        <div class="t1">POLICÍA MUNICIPAL DE TRÁNSITO</div>
        <div class="t2">Módulo Vivo – Revisiones 2026 (BY GELM)</div>
    </div>
    <div class="logo"><img src="icons/icon-512.png"></div>
</div>

<div id="estado">Cargando...</div>

<div class="barra">
    <select id="hojaSelect" onchange="cargarHoja()">
        <option value="C.PERMANENTE">C.PERMANENTE</option>
        <option value="C.TEMPORAL">C.TEMPORAL</option>
        <option value="RENOVACION" selected>RENOVACIÓN</option>
        <option value="TRASPASO">TRASPASO</option>
        <option value="D.D.PASO">D.D.PASO</option>
        <option value="L.NUEVA">L.NUEVA</option>
        <option value="CONSIGNACIONES</option>
        <option value="SUPLENTE">SUPLENTES</option>
    </select>

    <input id="busqueda" placeholder="Placa...">
    <button onclick="buscar()">Buscar</button>
</div>

<div id="resultado"></div>
<div id="similares"></div>

<div class="footer">
    Base viva conectada a jefatura | GELM<br>
    <span id="reloj"></span>
</div>

</div>

<script>
const hojas = {
 "C.PERMANENTE":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFZRw9HobwZM4W74A6LHkKrdkh9sNG87pD53I0RkCbi7TvI06q12IFdZYWeVo4lBR_pogKN9CuOJeg/pub?gid=877468283&single=true&output=csv",
 "RENOVACION":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFZRw9HobwZM4W74A6LHkKrdkh9sNG87pD53I0RkCbi7TvI06q12IFdZYWeVo4lBR_pogKN9CuOJeg/pub?gid=164141285&single=true&output=csv",
 "TRASPASO":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFZRw9HobwZM4W74A6LHkKrdkh9sNG87pD53I0RkCbi7TvI06q12IFdZYWeVo4lBR_pogKN9CuOJeg/pub?gid=1819752615&single=true&output=csv",
 "D.D.PASO":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFZRw9HobwZM4W74A6LHkKrdkh9sNG87pD53I0RkCbi7TvI06q12IFdZYWeVo4lBR_pogKN9CuOJeg/pub?gid=1994455640&single=true&output=csv",
 "L.NUEVA":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFZRw9HobwZM4W74A6LHkKrdkh9sNG87pD53I0RkCbi7TvI06q12IFdZYWeVo4lBR_pogKN9CuOJeg/pub?gid=180066267&single=true&output=csv",
 "C.TEMPORAL":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFZRw9HobwZM4W74A6LHkKrdkh9sNG87pD53I0RkCbi7TvI06q12IFdZYWeVo4lBR_pogKN9CuOJeg/pub?gid=1464244878&single=true&output=csv",
 "CONSIGNACIONES":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFZRw9HobwZM4W74A6LHkKrdkh9sNG87pD53I0RkCbi7TvI06q12IFdZYWeVo4lBR_pogKN9CuOJeg/pub?gid=1425102836&single=true&output=csv",
 "SUPLENTE":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFZRw9HobwZM4W74A6LHkKrdkh9sNG87pD53I0RkCbi7TvI06q12IFdZYWeVo4lBR_pogKN9CuOJeg/pub?gid=1370905759&single=true&output=csv"
};

let filas = [];
let similares = [];

function normalizar(t){
 return t.toString().replace(/\s+/g,"").replace(/-/g,"").toUpperCase();
}

async function cargarHoja(){
 const h = document.getElementById("hojaSelect").value;
 document.getElementById("estado").textContent = "Cargando "+h+"...";
 const r = await fetch(hojas[h]);
 const t = await r.text();
 filas = t.split("\n").map(l=>l.split(","));
 document.getElementById("estado").textContent =
   "Hoja "+h+" cargada. Registros: "+(filas.length-1);
 document.getElementById("resultado").innerHTML="";
 document.getElementById("similares").innerHTML="";
}

function buscar(){
 const q = normalizar(document.getElementById("busqueda").value);
 if(!q) return;
 const hits = [];

 filas.forEach((f,i)=>{
   if(i===0) return;
   const texto = normalizar(f.join(" "));
   if(texto.includes(q)){
     hits.push(f);
   }
 });

 if(hits.length===0){
   document.getElementById("resultado").innerHTML="No existe en esta hoja.";
   document.getElementById("similares").innerHTML="";
   return;
 }

 mostrar(hits[0]);

 if(hits.length>1){
   let opt = '<option value="">-- similares --</option>';
   hits.slice(1).forEach((r,i)=>{
     opt += `<option value="${i}">${r.join(" | ")}</option>`;
   });
   document.getElementById("similares").innerHTML =
     `<div class="similares-box">
        SIMILARES:
        <select onchange="mostrar(similares[this.value])">${opt}</select>
      </div>`;
   similares = hits.slice(1);
 }
}

function mostrar(f){
 let html="<table><tr>";
 f.forEach(c=>html+="<th>Dato</th>");
 html+="</tr><tr>";
 f.forEach(c=>html+="<td>"+c+"</td>");
 html+="</tr></table>";
 document.getElementById("resultado").innerHTML=html;
}

function reloj(){
 const d=new Date();
 document.getElementById("reloj").textContent=d.toLocaleString("es-ES");
}
setInterval(reloj,1000);
reloj();

cargarHoja();
</script>
</body>
</html>
