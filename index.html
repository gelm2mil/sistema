<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
:root{
  --neon:#00ff66;
  --glass:rgba(255,255,255,.05);
  --border:rgba(0,255,102,.7);
  --glow:0 0 22px rgba(0,255,102,.8);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}

/* ===== BODY FULL NATURAL ===== */
body{
  min-height:100vh;
  background:url("icons/natural.jpg") no-repeat center center;
  background-size:cover;
  background-attachment:scroll;
  color:#eafff2;
  overflow-x:hidden;
}

/* ===== HEADER ===== */
.header{
  margin:16px auto 14px;
  padding:16px 30px;
  border-radius:999px;
  background:var(--glass);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);
  box-shadow:var(--glow);
  width:fit-content;
  text-align:center;
}
.header h1{
  font-size:18px;
  font-weight:900;
  color:var(--neon);
}
.header span{
  display:block;
  font-size:12px;
}
.header .hora{
  margin-top:4px;
  font-size:11px;
  color:#b8ffe2;
}

/* ===== PLAYER ===== */
.player{
  max-width:420px;
  margin:10px auto 20px;
  padding:12px;
  border-radius:18px;
  background:var(--glass);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);
  box-shadow:var(--glow);
}
.player iframe{
  width:100%;
  height:120px;
  border:none;
  border-radius:14px;
}

/* ===== MENU ===== */
.menu{
  max-width:640px;
  margin:0 auto 50px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  padding:0 16px;
}

.menu a{
  text-decoration:none;
  text-align:center;
  padding:16px 12px;
  border-radius:18px;
  font-weight:800;
  font-size:13px;
  letter-spacing:.5px;
  color:var(--neon);
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border);
  box-shadow:0 0 18px rgba(0,255,102,.6);
  transition:.3s ease;
}

.menu a:hover{
  transform:translateY(-4px);
  box-shadow:0 0 35px rgba(0,255,102,1);
}

/* ===== FOOTER EXACTO ESTILO CAPTURA ===== */
footer{
  text-align:center;
  padding:18px 10px;
  font-size:13px;
  background:linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,.95));
  color:#00ffff;
  border-top:3px solid #00ffff;
  text-shadow:0 0 10px rgba(0,255,255,.8);
}

footer span{
  display:block;
  margin-top:6px;
  color:#00ffd5;
}

/* ===== BOTONES FLOTANTES ===== */
.btn-gpt,.btn-2026{
  position:fixed;
  bottom:18px;
  padding:14px 20px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  color:var(--neon);
  font-weight:900;
  text-decoration:none;
  border:1px solid var(--border);
  box-shadow:var(--glow);
  z-index:3;
}

.btn-gpt{right:18px}
.btn-2026{left:18px}
</style>
</head>

<script>
const frases=[
"Gracias a Dios, un nuevo día.",
"El día avanza y tú lo estás logrando.",
"Disciplina hoy, tranquilidad mañana.",
"Orden, visión y firmeza.",
"Todo trabajo bien hecho deja huella."
];

function rotar(){
 document.getElementById("frase").textContent=
 frases[Math.floor(Math.random()*frases.length)];
}
rotar();setInterval(rotar,1000*60*30);

function reloj(){
 const d=new Date();
 document.getElementById("hora").textContent=
 d.toLocaleDateString("es-GT",{weekday:"long",day:"numeric",month:"long"})+
 " — "+d.toLocaleTimeString("es-GT");

 document.getElementById("footerHora").textContent=
 d.toLocaleDateString("es-GT")+
 " | "+d.toLocaleTimeString("es-GT");
}
reloj();setInterval(reloj,1000);
</script>
