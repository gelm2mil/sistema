<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMT TRANSPORTES 2026 — BY GELM</title>

<!-- XLSX -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    color:#eee;
    background:radial-gradient(circle at 20% 0%,rgba(0,255,255,.2),transparent 50%),
               radial-gradient(circle at 80% 0%,rgba(255,0,255,.18),transparent 55%),
               #05010a;
    background-attachment:fixed;
}
.contenedor{
    max-width:1200px;
    margin:auto;
    background:rgba(0,0,0,.85);
    border-radius:18px;
    padding:20px;
    box-shadow:0 0 18px rgba(0,255,255,.5);
    border:1px solid rgba(0,255,255,.35);
}
h1{
    text-align:center;
    color:#00ffc8;
    text-shadow:0 0 10px #00ffff;
}
#estado{
    text-align:center;
    font-size:14px;
    color:#aaa;
    margin:10px 0;
}
.buscador{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:10px;
}
.buscador input{
    padding:10px;
    font-size:16px;
    border-radius:999px;
    border:1px solid #00ffc8;
    background:#050513;
    color:#00ffc8;
}
.buscador button{
    padding:10px 22px;
    font-size:16px;
    border-radius:999px;
    border:none;
    background:radial-gradient(circle at 30% 0,#00ffff,#5f00ff);
    font-weight:bold;
    cursor:pointer;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    background:#141414;
}
th,td{
    border:1px solid #333;
    padding:6px;
    font-size:13px;
}
th{
    background:#00ffc8;
    color:#000;
}
.similares-box{
    margin-top:10px;
    font-size:12px;
}
.similares-box select{
    background:#020b40;
    color:#fff;
    border-radius:999px;
    border:1px solid #00ffc8;
    padding:6px 10px;
}
.footer{
    margin-top:15px;
    text-align:center;
    font-size:12px;
    color:#6fffe9;
}
</style>
</head>

<body>
<div class="contenedor">
<h1>SISTEMA DE TRANSPORTES 2026 — PMT CHIMALTENANGO</h1>

<div id="estado">Cargando registros…</div>

<div class="buscador">
<input id="busquedaInput" placeholder="Placa, DPI, licencia, documento o calcomanía">
<button onclick="buscar()">Buscar</button>
</div>

<div id="resultado">
<div id="resultado-principal"></div>
<div id="similares-contenedor"></div>
</div>

<div class="footer">
© 2026 — Sistema GELM · Uso interno autorizado
</div>
</div>

<script>
let registros=[];
let similares=[];

async function cargarExcel(){
    try{
        const resp = await fetch("https://docs.google.com/spreadsheets/d/1H03tNpXEYw-H288A6yuxtmV_ZN8rfolx/export?format=xlsx");
        const data=await resp.arrayBuffer();
        const wb=XLSX.read(data,{type:"array"});
        const hoja=wb.Sheets[wb.SheetNames[0]];
        const filas=XLSX.utils.sheet_to_json(hoja,{header:1,raw:false});

        let inicio=filas.findIndex(f=>(f[0]||"").toUpperCase().startsWith("M-"));
        for(let i=inicio;i<filas.length;i++){
            const f=filas[i];
            if(!f[0])continue;
            registros.push({
                placa:(f[0]||"").toUpperCase(),
                calcomania:(f[1]||""),
                concesionario:(f[3]||""),
                telDueno:(f[4]||""),
                ruta:(f[5]||""),
                telPilotos:(f[6]||""),
                nombrePiloto:(f[7]||""),
                dpi:(f[8]||""),
                documento:(f[9]||""),
                licencia:(f[10]||""),
                tipoLic:(f[11]||"")
            });
        }
        document.getElementById("estado").textContent="Registros cargados: "+registros.length;
    }catch(e){
        document.getElementById("estado").textContent="Error cargando datos";
        console.error(e);
    }
}

function norm(t){
    return t.replace(/\s+/g,"").replace(/-/g,"").toUpperCase();
}

function tabla(r){
return `
<table>
<tr>
<th>PLACA</th><th>CALCOMANÍA</th><th>CONCESIONARIO</th><th>TEL DUEÑO</th>
<th>RUTA</th><th>TEL PILOTO</th><th>PILOTO</th><th>DPI</th>
<th>DOCUMENTO</th><th>LICENCIA</th><th>TIPO</th>
</tr>
<tr>
<td>${r.placa}</td><td>${r.calcomania}</td><td>${r.concesionario}</td>
<td>${r.telDueno}</td><td>${r.ruta}</td><td>${r.telPilotos}</td>
<td>${r.nombrePiloto}</td><td>${r.dpi}</td><td>${r.documento}</td>
<td>${r.licencia}</td><td>${r.tipoLic}</td>
</tr>
</table>`;
}

function buscar(){
const t=document.getElementById("busquedaInput").value.trim();
const limpio=norm(t);
const res=document.getElementById("resultado-principal");
const sim=document.getElementById("similares-contenedor");
sim.innerHTML="";
if(!t){res.innerHTML="";return;}

const c=[];
registros.forEach(r=>{
let p=0;
if(norm(r.calcomania)===limpio)p=100;
if(norm(r.placa)===limpio)p=Math.max(p,90);
if(norm(r.dpi)===limpio)p=Math.max(p,80);
if(norm(r.licencia)===limpio)p=Math.max(p,70);
if(norm(r.documento)===limpio)p=Math.max(p,60);
if(p>0)c.push({r,p});
});

if(!c.length){res.innerHTML="No encontrado";return;}
c.sort((a,b)=>b.p-a.p);

res.innerHTML=tabla(c[0].r);
similares=c.slice(1).map(x=>x.r);

if(similares.length){
let opt='<option value="">-- similares --</option>';
similares.forEach((r,i)=>{
opt+=`<option value="${i}">${r.calcomania} — ${r.ruta}</option>`;
});
sim.innerHTML=`<div class="similares-box">
<select onchange="sel(this.value)">${opt}</select>
</div>`;
}
}

function sel(i){
if(similares[i])document.getElementById("resultado-principal").innerHTML=tabla(similares[i]);
}

cargarExcel();
</script>
</body>
</html>
