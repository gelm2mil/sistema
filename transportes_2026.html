<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM BY GELM — TRANSPORTES 2026</title>

<style>
:root{
  --neon:#00ffd5;
  --bg1:#020b18;
  --bg2:#041d33;
  --card:rgba(4,18,34,.92);
  --txt:#e9ffff;
  --glow:0 0 18px rgba(0,255,213,.35);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,Segoe UI,Arial;
  background:
    radial-gradient(circle at 20% 20%, #063b7a 0%, transparent 55%),
    radial-gradient(circle at 80% 80%, #0a0033 0%, transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--txt);
  min-height:100vh;
}

/* CONTENEDOR */
.wrapper{
  max-width:1100px;
  margin:20px auto;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(0,255,213,.35);
  border-radius:22px;
  box-shadow:var(--glow);
  overflow:hidden;
}

/* HEADER */
.header{
  text-align:center;
  padding:18px;
  border-bottom:1px solid rgba(0,255,213,.25);
}
.header h1{
  color:var(--neon);
  text-shadow:var(--glow);
}
.fecha{
  font-size:13px;
  opacity:.85;
  margin-top:4px;
}

/* BUSCADOR */
.buscador{
  max-width:520px;
  margin:20px auto 10px;
}
.buscador input{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid rgba(0,255,213,.45);
  background:#000;
  color:var(--neon);
  font-size:15px;
  outline:none;
}

/* LISTA */
.lista{
  max-width:520px;
  margin:0 auto 16px;
  background:#000;
  border:1px solid rgba(0,255,213,.35);
  border-radius:16px;
  max-height:260px;
  overflow-y:auto;
}
.item{
  padding:12px 14px;
  border-bottom:1px solid rgba(0,255,213,.15);
  cursor:pointer;
}
.item strong{color:var(--neon)}
.item small{
  display:block;
  opacity:.8;
  font-size:12px;
}
.item:hover{
  background:var(--neon);
  color:#000;
}
.item:hover strong{color:#000}

/* INFO ACTIVA */
.info{
  max-width:720px;
  margin:0 auto 16px;
  padding:12px;
  border-radius:14px;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(0,255,213,.35);
  text-align:center;
  color:var(--neon);
  font-size:14px;
}

/* RESULTADO */
.resultado{
  max-width:100%;
  margin:0 auto 18px;
  background:var(--card);
  border:1px solid rgba(0,255,213,.35);
  border-radius:18px;
  box-shadow:var(--glow);
  padding:10px;
  overflow-x:auto;
}

/* TABLA */
table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  border:1px solid rgba(255,255,255,.15);
  padding:8px 10px;
  white-space:nowrap;          /* 🔑 CLAVE */
  text-overflow:ellipsis;
}
th{
  background:var(--neon);
  color:#000;
  font-weight:800;
}

/* FOOTER */
.footer{
  text-align:center;
  font-size:12px;
  padding:12px;
  border-top:1px solid rgba(0,255,213,.25);
  opacity:.85;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="header">
    <h1>SYSTEM BY GELM — TRANSPORTES 2026</h1>
    <div id="fecha" class="fecha"></div>
  </div>

  <div class="buscador">
    <input id="buscar" placeholder="Buscar placa, calcomanía, nombre, ruta…">
  </div>

  <div id="lista" class="lista"></div>

  <div id="info" class="info">Seleccione un registro</div>

  <div id="resultado" class="resultado" style="display:none"></div>

  <div class="footer">
    © 2025–2026 — Sistema GELM · Uso interno autorizado
  </div>

</div>

<script>
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSwaUTpai-4dbcMc3imM8jfxPu7Wrzwpi-EqICd1yDRHmFfKAMwMxu8jwXMXqs3GQ/pub?gid=1355305835&single=true&output=csv";
let filas=[];

/* FECHA */
setInterval(()=>{
 const f=new Date();
 document.getElementById("fecha").textContent=
  f.toLocaleDateString("es-GT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+
  " — "+f.toLocaleTimeString("es-GT");
},1000);

/* CARGA */
fetch(URL).then(r=>r.text()).then(t=>{
 filas=t.split("\n").map(l=>l.split(","));
 renderLista();
});

/* LISTA */
function renderLista(){
 const box=document.getElementById("lista");
 box.innerHTML="";
 filas.slice(1).forEach(f=>{
  const d=document.createElement("div");
  d.className="item";
  d.innerHTML=`
    <strong>${f[1]||"SIN NOMBRE"}</strong>
    <small>${f[4]||""} · ${f[0]||""}</small>`;
  d.onclick=()=>mostrar(f);
  box.appendChild(d);
 });
}

/* MOSTRAR */
function mostrar(f){
 document.getElementById("info").innerHTML=
  `<strong>${f[1]}</strong> — ${f[4]}`;

 let h="<table><tr>";
 f.forEach(()=>h+="<th>Dato</th>");
 h+="</tr><tr>";
 f.forEach(c=>h+=`<td>${c||""}</td>`);
 h+="</tr></table>";

 const r=document.getElementById("resultado");
 r.innerHTML=h;
 r.style.display="block";
}
</script>

</body>
</html>
