<style>
:root{
  --neon:#00ff66;
  --border:rgba(0,255,102,.85);
  --glow:0 0 25px rgba(0,255,102,1);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}

body{
  min-height:100vh;
  background:url("icons/natural.jpg") no-repeat center center;
  background-size:cover;
  color:#eafff2;
  overflow-x:hidden;
  transition:transform .25s ease-out;
}

/* ===== PARTICULAS ===== */
canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* ===== AURORA SUTIL ===== */
.aurora{
  position:fixed;
  top:-20%;
  left:-20%;
  width:140%;
  height:60%;
  background:radial-gradient(ellipse at center,
    rgba(0,255,102,.25),
    rgba(0,255,102,.12),
    transparent 70%);
  filter:blur(90px);
  animation:auroraMove 18s ease-in-out infinite alternate;
  z-index:1;
  pointer-events:none;
}

@keyframes auroraMove{
  0%{transform:translateX(-5%) translateY(0%)}
  100%{transform:translateX(5%) translateY(3%)}
}

/* ===== HEADER ===== */
.header{
  position:relative;
  z-index:3;
  margin:18px auto 16px;
  padding:18px 36px;
  border-radius:999px;
  background:rgba(255,255,255,.02);
  backdrop-filter:blur(22px);
  border:1px solid var(--border);
  box-shadow:0 0 35px rgba(0,255,102,.6);
  width:fit-content;
  text-align:center;
}
.header h1{
  font-size:18px;
  font-weight:900;
  color:var(--neon);
}
.header span{display:block;font-size:12px}
.header .hora{margin-top:4px;font-size:11px;color:#b8ffe2}

/* ===== PLAYER ===== */
.player{
  position:relative;
  z-index:3;
  max-width:420px;
  margin:12px auto 24px;
  padding:14px;
  border-radius:20px;
  background:rgba(255,255,255,.015);
  backdrop-filter:blur(28px);
  border:1px solid var(--border);
  box-shadow:var(--glow);
}
.player iframe{
  width:100%;
  height:120px;
  border:none;
  border-radius:14px;
}

/* ===== MENU ===== */
.menu{
  position:relative;
  z-index:3;
  max-width:640px;
  margin:0 auto 60px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  padding:0 16px;
}

.menu a{
  position:relative;
  overflow:hidden;
  text-decoration:none;
  text-align:center;
  padding:18px 12px;
  border-radius:22px;
  font-weight:800;
  font-size:13px;
  letter-spacing:.5px;
  color:var(--neon);
  background:transparent;
  backdrop-filter:blur(35px);
  border:1px solid var(--border);
  box-shadow:0 0 20px rgba(0,255,102,.6);
  transition:.2s ease;
}

/* Pulsación real visible */
.menu a::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:22px;
  border:2px solid rgba(0,255,102,.6);
  animation:borderPulse 2.8s infinite;
}

@keyframes borderPulse{
  0%{opacity:.3}
  50%{opacity:1}
  100%{opacity:.3}
}

.menu a:active{
  transform:scale(.95);
  box-shadow:0 0 45px rgba(0,255,102,1);
}

/* ===== FOOTER EXACTO ===== */
footer{
  position:relative;
  z-index:3;
  text-align:center;
  padding:18px 10px;
  font-size:13px;
  background:linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,.95));
  color:#00ffff;
  border-top:3px solid #00ffff;
  text-shadow:0 0 10px rgba(0,255,255,.8);
}
footer span{
  display:block;
  margin-top:6px;
  color:#00ffd5;
}

/* ===== BOTONES FLOTANTES ===== */
.btn-gpt,.btn-2026{
  position:fixed;
  bottom:18px;
  padding:14px 22px;
  border-radius:999px;
  background:transparent;
  backdrop-filter:blur(28px);
  color:var(--neon);
  font-weight:900;
  text-decoration:none;
  border:1px solid var(--border);
  box-shadow:var(--glow);
  z-index:4;
}
.btn-gpt{right:18px}
.btn-2026{left:18px}
</style>
</head>

<script>
const frases=[
"Gracias a Dios, un nuevo día.",
"El día avanza y tú lo estás logrando.",
"Disciplina hoy, tranquilidad mañana.",
"Orden, visión y firmeza.",
"Todo trabajo bien hecho deja huella."
];
function rotar(){
 document.getElementById("frase").textContent=
 frases[Math.floor(Math.random()*frases.length)];
}
rotar();setInterval(rotar,1000*60*30);

function reloj(){
 const d=new Date();
 document.getElementById("hora").textContent=
 d.toLocaleDateString("es-GT",{weekday:"long",day:"numeric",month:"long"})+
 " — "+d.toLocaleTimeString("es-GT");
 document.getElementById("footerHora").textContent=
 d.toLocaleDateString("es-GT")+" | "+d.toLocaleTimeString("es-GT");
}
reloj();setInterval(reloj,1000);

/* PARTICULAS NARANJA OPTIMIZADAS */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];
for(let i=0;i<90;i++){
 particles.push({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2+1,
  dx:(Math.random()-0.5)*0.5,
  dy:(Math.random()-0.5)*0.5
 });
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 particles.forEach(p=>{
  let g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
  g.addColorStop(0,"rgba(255,180,0,1)");
  g.addColorStop(.5,"rgba(255,80,0,.9)");
  g.addColorStop(1,"rgba(255,0,0,0)");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r*2,0,Math.PI*2);
  ctx.fill();
  p.x+=p.dx;
  p.y+=p.dy;
 });
 requestAnimationFrame(draw);
}
draw();

/* MICRO PARALLAX */
window.addEventListener("deviceorientation",e=>{
 if(!e.beta) return;
 let x=e.gamma/40;
 let y=e.beta/40;
 document.body.style.transform=
 `translate(${x}px,${y}px)`;
});
</script>
