<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM BY GELM — RENOVACIÓN 2026</title>

<style>
:root{
  --neon:#00ffd5;
  --bg1:#020b18;
  --bg2:#041d33;
  --card:rgba(4,18,34,.92);
  --txt:#e9ffff;
  --glow:0 0 18px rgba(0,255,213,.35);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui}

body{
  min-height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--txt);
}

.contenedor{
  max-width:920px;
  margin:18px auto;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(0,255,213,.35);
  border-radius:22px;
  box-shadow:var(--glow);
  padding:20px;
}

/* HEADER */
.header{
  text-align:center;
  padding-bottom:14px;
  border-bottom:1px solid rgba(0,255,213,.25);
}
.header h1{
  color:var(--neon);
  text-shadow:var(--glow);
}
.header .fecha{
  font-size:13px;
  opacity:.85;
}

/* BUSCADOR */
.buscador{
  margin:18px auto;
  max-width:520px;
}
.buscador input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(0,255,213,.45);
  background:#000;
  color:var(--neon);
  font-size:15px;
}

/* LISTA PLACAS */
.lista{
  margin-top:10px;
  max-height:180px;
  overflow-y:auto;
  border-radius:14px;
  border:1px solid rgba(0,255,213,.25);
}
.item{
  padding:12px;
  border-bottom:1px solid rgba(0,255,213,.15);
  cursor:pointer;
}
.item:hover{
  background:rgba(0,255,213,.18);
}

/* MENSAJE */
.mensaje{
  margin:16px 0;
  padding:12px;
  text-align:center;
  border-radius:14px;
  background:#000;
  border:1px solid rgba(0,255,213,.35);
  color:var(--neon);
}

/* RESUMEN */
.resumen{
  margin-top:16px;
  padding:14px;
  background:#000;
  border-radius:14px;
  border:1px solid rgba(0,255,213,.35);
  color:var(--neon);
  text-align:center;
}

/* TABLA */
.tabla-scroll{
  margin-top:14px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
table{
  min-width:720px;
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border:1px solid rgba(0,255,213,.25);
  text-align:center;
}
th{
  background:linear-gradient(90deg,#0affd5,#00cfa9);
  color:#000;
}

/* FOOTER */
.footer{
  margin-top:16px;
  text-align:center;
  font-size:12px;
  opacity:.8;
  border-top:1px solid rgba(0,255,213,.25);
  padding-top:10px;
}
</style>
</head>

<body>

<div class="contenedor">

  <div class="header">
    <h1>SYSTEM BY GELM — RENOVACIÓN 2026</h1>
    <div id="fechaHora" class="fecha"></div>
  </div>

  <div class="buscador">
    <input id="busqueda" placeholder="Buscar placa..." oninput="filtrar()">
  </div>

  <div id="lista" class="lista"></div>

  <div id="mensaje" class="mensaje">
    Seleccione una placa
  </div>

  <div id="resumen" class="resumen" style="display:none"></div>

  <div id="tabla" class="tabla-scroll"></div>

  <div class="footer">
    © 2025–2026 — Sistema GELM<br>
    Desarrollo, diseño y propiedad intelectual reservada — BY GELM<br>
    Uso interno autorizado
  </div>

</div>

<script>
const datos = [
  {id:24, placa:"C-985BZH", fecha:"04/02/2026", tipo:"RENOVACION 2026", obs:"ESCOLAR 12-2025"},
  {id:12, placa:"C-001CBC", fecha:"15/01/2026", tipo:"RENOVACION 2026", obs:"PARTICULAR"},
  {id:8, placa:"C-423BLD", fecha:"10/01/2026", tipo:"RENOVACION 2026", obs:"MOTO"}
];

function renderLista(lista){
  const cont=document.getElementById("lista");
  cont.innerHTML="";
  lista.forEach(d=>{
    const div=document.createElement("div");
    div.className="item";
    div.textContent=d.placa;
    div.onclick=()=>mostrar(d);
    cont.appendChild(div);
  });
}

function filtrar(){
  const q=document.getElementById("busqueda").value.toUpperCase();
  const res = q===""
    ? datos
    : datos.filter(d=>d.placa.includes(q));
  renderLista(res);
}

function mostrar(d){
  document.getElementById("mensaje").style.display="none";
  document.getElementById("resumen").style.display="block";
  document.getElementById("resumen").innerHTML=
    `${d.placa} — ${d.tipo}<br>Fecha: ${d.fecha} | ${d.obs}`;

  document.getElementById("tabla").innerHTML=`
    <table>
      <tr><th>Dato</th><th>Placa</th><th>Fecha</th><th>Tipo</th><th>Obs</th></tr>
      <tr>
        <td>${d.id}</td>
        <td>${d.placa}</td>
        <td>${d.fecha}</td>
        <td>${d.tipo}</td>
        <td>${d.obs}</td>
      </tr>
    </table>`;
}

function reloj(){
  const f=new Date();
  document.getElementById("fechaHora").textContent=
    f.toLocaleDateString("es-GT",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+
    " — "+f.toLocaleTimeString("es-GT");
}
setInterval(reloj,1000);reloj();

renderLista(datos);
</script>

</body>
</html>
