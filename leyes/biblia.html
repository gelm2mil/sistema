<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia — GELM</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: #eee;
  background:
    radial-gradient(circle at 20% 0%, rgba(0,255,255,0.2), transparent 50%),
    radial-gradient(circle at 80% 0%, rgba(255,0,255,0.18), transparent 55%),
    #05010a;
  background-attachment: fixed;
}

.contenedor {
  max-width: 1200px;
  margin: 0 auto;
  background: rgba(0, 0, 0, 0.82);
  border-radius: 18px;
  padding: 20px;
  box-shadow:
    0 0 18px rgba(0,255,255,0.5),
    0 0 50px rgba(0,0,0,1);
  border: 1px solid rgba(0,255,255,0.35);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 15px;
}

.logo-box {
  padding: 6px;
  border-radius: 14px;
  background: radial-gradient(circle at 30% 0, rgba(0,255,120,0.3), rgba(0,255,255,0.05));
  box-shadow:
    0 0 10px rgba(0,255,120,0.9),
    0 0 25px rgba(0,0,0,0.9);
  border: 1px solid rgba(0,255,180,0.9);
}

.logo-box img {
  display: block;
  max-width: 110px;
}

.titulos {
  text-align: center;
}

.titulos-linea1 {
  font-size: 22px;
  font-weight: bold;
  color: #00ffc8;
  text-shadow: 0 0 10px #00ffff, 0 0 25px #0044ff;
}

.titulos-linea2 {
  font-size: 14px;
  margin-top: 6px;
  color: #ffdf5e;
}

.verso-dinamico {
  margin: 12px auto 18px auto;
  max-width: 900px;
  padding: 14px 18px;
  border-radius: 14px;
  background: rgba(0,255,200,0.08);
  border: 1px solid rgba(0,255,200,0.35);
  color: #a8ffe8;
  font-size: 14px;
  text-align: center;
  box-shadow: 0 0 12px rgba(0,255,200,0.35);
}

.buscador {
  max-width: 700px;
  margin: 0 auto 18px auto;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.buscador input {
  flex: 1;
  padding: 10px 12px;
  font-size: 16px;
  border-radius: 999px;
  border: 1px solid #00ffc8;
  background: #050513;
  color: #00ffc8;
}

.buscador button {
  padding: 10px 22px;
  border-radius: 999px;
  border: none;
  background: radial-gradient(circle at 30% 0, #00ffff, #5f00ff);
  color: #000;
  font-weight: bold;
  cursor: pointer;
}

.resultado {
  background: #b8ffe6;
  color: #001010;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #00ffc8;
}

.similares-box {
  margin-top: 10px;
  font-size: 12px;
  color: #a8ffe8;
}

.similares-box select {
  background: #020b40;
  color: #ffffff;
  border-radius: 999px;
  border: 1px solid #00ffc8;
  padding: 5px 10px;
  min-width: 250px;
}

.footer-info {
  margin-top: 18px;
  text-align: center;
  font-size: 12px;
  color: #4ee8ff;
}
.footer-info strong { color: #7bffb2; }
</style>
</head>

<body>
<div class="contenedor">

  <div class="header-top">
    <div class="logo-box">
      <img src="https://gelmhistoria.webcindario.com/pmt.jpg">
    </div>

    <div class="titulos">
      <div class="titulos-linea1">BIBLIA — PALABRA DE VIDA</div>
      <div class="titulos-linea2">“Lámpara es a mis pies tu palabra.” — Salmos 119:105</div>
    </div>

    <div class="logo-box">
      <img src="https://gelmhistoria.webcindario.com/PMT/gelm.png">
    </div>
  </div>

  <div id="versoDinamico" class="verso-dinamico"></div>

  <div class="buscador">
    <input id="q" placeholder="Ej: Génesis, Génesis 3, Juan 3:16, amor">
    <button onclick="buscar()">Buscar</button>
  </div>

  <div id="resultados"></div>

  <div class="footer-info">
    <div>BY GELM — Uso personal | <strong>Palabra Viva</strong></div>
    <div id="fechaHora"></div>
  </div>

</div>

<script src="biblia_data.js"></script>

<script>
const versosInicio = [
  "El Señor es mi pastor; nada me faltará. — Salmos 23:1",
  "Todo lo puedo en Cristo que me fortalece. — Filipenses 4:13",
  "En el principio creó Dios los cielos y la tierra. — Génesis 1:1",
  "Lámpara es a mis pies tu palabra. — Salmos 119:105"
];
document.getElementById("versoDinamico").textContent =
  versosInicio[Math.floor(Math.random()*versosInicio.length)];

function actualizarFechaHora(){
  const a = new Date();
  document.getElementById("fechaHora").textContent =
    a.toLocaleDateString("es-ES",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+
    " — "+a.toLocaleTimeString("es-ES");
}
setInterval(actualizarFechaHora,1000); actualizarFechaHora();

/* === Motor preparado para el nuevo biblia_data.js estructurado === */
let DATA = window.BIBLIA || [];

function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

function buscar(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const cont = document.getElementById("resultados");
  cont.innerHTML = "";
  if(!q) return;

  let libro="", cap="", ver="";
  const m = q.match(/^(.+?)\s+(\d+)(?::(\d+))?$/);
  if(m){ libro=m[1]; cap=m[2]; ver=m[3]||""; }

  let res = DATA.filter(r=>{
    if(libro){
      if(!r.libro.toLowerCase().includes(libro.toLowerCase())) return false;
      if(cap && r.capitulo!=cap) return false;
      if(ver && r.versiculo!=ver) return false;
      return true;
    }
    return r.texto.toLowerCase().includes(q);
  });

  if(!res.length){ cont.innerHTML="<p>No se encontraron coincidencias.</p>"; return; }

  const p = res[0];
  cont.innerHTML = `
    <div class="resultado">
      <h3>${esc(p.libro)} ${p.capitulo}:${p.versiculo}</h3>
      <div>${esc(p.texto)}</div>
    </div>
  `;

  const sim = res.slice(1).filter(x=>x.libro==p.libro && x.capitulo==p.capitulo);
  if(sim.length){
    let s = `<div class="similares-box"><select onchange="mostrar(this.value)">
      <option value="">-- similares --</option>`;
    sim.forEach((x,i)=>s+=`<option value="${i}">${x.libro} ${x.capitulo}:${x.versiculo}</option>`);
    s+=`</select></div>`;
    cont.insertAdjacentHTML("beforeend",s);
    window._sim=sim;
  }
}
function mostrar(i){
  const x=_sim[i]; if(!x) return;
  document.getElementById("resultados").innerHTML=`
    <div class="resultado">
      <h3>${esc(x.libro)} ${x.capitulo}:${x.versiculo}</h3>
      <div>${esc(x.texto)}</div>
    </div>`;
}
</script>
</body>
</html>
